name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/cli.md'
      - 'docs/plugins.md'
      - 'docs/sdk.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 同步单一事实源的完整指南到站点(单页版;站点索引页保留导航形态)
      - name: Sync guides into site
        run: |
          mkdir -p docs/site/cli docs/site/plugins docs/site/sdk
          cp docs/cli.md docs/site/cli/index.md
          cp docs/plugins.md docs/site/plugins/guide.md
          cp docs/sdk.md docs/site/sdk/guide.md
      - name: Build VitePress site
        run: |
          cd docs/site
          npm install vitepress@latest --no-save --silent
          npx vitepress build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
