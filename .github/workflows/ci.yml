# CI 快测门禁:PR 必跑 typecheck / lint / unit / mjs 四步,另有 build-smoke 生产构建启动验收。
# Team/chat/HITL/DAQ-DCW 模拟器 e2e 与外部依赖测试按环境分层,不在 PR 必跑
# (套件矩阵见 docs/audit/2026-10-30-real-harness-acceptance-report.md)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 包管理器为 pnpm(package.json packageManager: pnpm@11.9.0,pnpm-lock.yaml 为准)。
      # setup-node 的 cache:pnpm 需要 PATH 里已有 pnpm —— 先经 action-setup 安装,
      # 否则缓存步骤直接失败(2026-11-03 实测:Unable to locate executable file: pnpm)。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:unit
      - name: Unit tests (mjs suites)
        run: pnpm run test:unit-mjs
      - name: i18n parity
        run: pnpm run i18n:check
      - name: CSS variable integrity
        run: pnpm run check:cssvars
      - name: Frontend lifecycle contract
        run: pnpm run frontend-lifecycle-contract

  # 生产构建 + 启动冒烟:quick-gate 只验静态与单测,构建/SSR/鉴权门在此层兜底。
  # 独立 job 便于失败归因;不做外部依赖(无 Timescale/MQTT/模型),只用临时 home。
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production output
        run: pnpm run build
      - name: Boot smoke (health, SSR, auth gate, missing-secret refusal)
        run: pnpm run test:boot-smoke
