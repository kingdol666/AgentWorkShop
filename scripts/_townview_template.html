                  </option>
                </select>
              </div>

              <!-- 数采绑定 -->
              <div class="sect-hd">
                数采绑定
              </div>
              <div
                v-for="r in boundDaqRows"
                :key="r.daqId"
                class="bind-row-item"
              >
                <span
                  class="bind-dot"
                  :style="{ background: r.color }"
                />
                <span class="bind-name">{{ r.name }}</span>
                <span class="bind-val">{{ r.value }} {{ r.unit }}</span>
                <button
                  class="bind-x"
                  title="解除绑定"
                  @click="unbindDaq(r.daqId)"
                >
                  ✕
                </button>
              </div>
              <div
                v-if="!boundDaqRows.length"
                class="ins-empty"
              >
                暂无绑定 · 可拖入数采节点后绑定
              </div>
              <div class="bind-add">
                <select
                  v-model="bindPick"
                  class="bind-select"
                >
                  <option value="">
                    选择数采节点…
                  </option>
                  <option
                    v-for="dq in daqTwins"
                    :key="dq.id"
                    :value="dq.id"
                  >
                    {{ dq.name }}
                  </option>
                </select>
                <button
                  class="bind-add-btn"
                  :disabled="!bindPick"
                  @click="bindDaq(bindPick, selected.id); bindPick = ''"
                >
                  绑定
                </button>
              </div>

              <!-- 变换模式(Blender G/R/S) -->
              <div class="sect-hd">
                变换 · BLENDER
              </div>
              <div class="xz-seg">
                <button
                  class="seg-btn"
                  :class="{ on: tMode === 'translate' }"
                  @click="setTMode('translate')"
                >
                  移动 G
                </button>
                <button
                  class="seg-btn"
                  :class="{ on: tMode === 'rotate' }"
                  @click="setTMode('rotate')"
                >
                  旋转 R
                </button>
                <button
                  class="seg-btn"
                  :class="{ on: tMode === 'scale' }"
                  @click="setTMode('scale')"
                >
                  缩放 S
                </button>
              </div>
              <div class="scale-row">
                <span class="scale-min">0.2×</span>
                <input
                  class="scale-range"
                  type="range"
                  min="0.2"
                  max="5"
                  step="0.05"
                  :value="selected.scale"
                  @input="onScaleInput(Number(($event.target as HTMLInputElement).value))"
                  @change="onScaleCommit(Number(($event.target as HTMLInputElement).value))"
                >
                <span class="scale-max">5×</span>
              </div>
              <div class="scale-val">
                {{ Math.round(selected.scale * 100) }}%
              </div>

              <div class="ins-foot">
                <button
                  class="btn btn-danger ins-del"
                  :class="{ armed: deviceDeleteArmed === selected.id }"
                  @click="removeSelectedDevice"
                >
                  {{ deviceDeleteArmed === selected.id ? '再次点击确认删除' : '删除设备实例' }}
                </button>
              </div>
            </template>
          </template>

          <template v-else-if="selected.kind === 'agent'">
            <div class="obj-row">
              <span class="obj-label">模型</span>
              <select
                class="obj-select"
                :value="(scene3dRef?.getAgentModel?.(selected.id) ?? '') || 'hero-3d'"
                @change="bindAgentModel(($event.target as HTMLSelectElement).value)"
              >
                <option
                  v-for="m in agentModels"
                  :key="m.id"
                  :value="m.id"
                >
                  {{ m.name }}
                </option>
              </select>
            </div>
            <div class="obj-sep" />
            <div class="obj-row">
              <span class="obj-label">活动范围</span>
              <span class="range-status">{{ agentRangeStatusText }}</span>
              <button
                class="obj-mini"
                :class="{ on: agentDrawingRange }"
                title="在场景中拖动框选,确定该角色的移动范围"
                @click="onToggleRangeDraw"
              >
                {{ agentDrawingRange ? '绘制中' : '框选绘制' }}
              </button>
            </div>
            <template v-if="agentRangeDraft">
              <div class="obj-row">
                <span class="obj-label">形状</span>
                <div class="bp-seg">
                  <button
                    class="seg-btn"
                    :class="{ on: agentRangeDraft.shape === 'ellipse' }"
                    @click="agentRangeDraft.shape = 'ellipse'; applyAgentRangeDraft()"
                  >
                    椭圆
                  </button>
                  <button
                    class="seg-btn"
                    :class="{ on: agentRangeDraft.shape === 'rect' }"
                    @click="agentRangeDraft.shape = 'rect'; applyAgentRangeDraft()"
                  >
                    矩形
                  </button>
                </div>
              </div>
              <div class="obj-row">
                <span class="obj-label">横轴</span>
                <input
                  v-model.number="agentRangeDraft.radiusX"
                  class="obj-range"
                  type="range"
                  min="40"
                  max="4000"
                  step="8"
                  @input="applyAgentRangeDraft"
                  @change="onAgentRangeCommit"
                >
                <span class="bp-val">{{ Math.round(agentRangeDraft.radiusX) }}</span>
              </div>
              <div class="obj-row">
                <span class="obj-label">纵轴</span>
                <input
                  v-model.number="agentRangeDraft.radiusZ"
                  class="obj-range"
                  type="range"
                  min="40"
                  max="4000"
                  step="8"
                  @input="applyAgentRangeDraft"
                  @change="onAgentRangeCommit"
                >
                <span class="bp-val">{{ Math.round(agentRangeDraft.radiusZ) }}</span>
              </div>
              <button
                class="obj-mini danger"
                @click="onClearAgentRange"
              >
                清除范围(回退频道)
              </button>
            </template>
            <div
              v-else
              class="ins-empty"
            >
              未设置:沿用频道领地活动;点「框选绘制」定制
            </div>
          </template>
        </section>

        <section class="panel">
          <div class="panel-hd">
            <h3>设备运行状态</h3>
          </div>
          <div class="health-body">
            <div class="donut-wrap">
              <canvas
                ref="donutCanvas"
                width="118"
                height="118"
              />
              <div class="donut-center">
                <b>{{ healthPct }}%</b>
                <span>设备健康度</span>
              </div>
            </div>
            <div class="health-legend">
              <div class="hl-row">
                <span
                  class="hl-dot"
                  :style="{ background: 'var(--hud-accent)' }"
                />
                运行中
                <span class="n">{{ runningCount }}</span>
              </div>
              <div class="hl-row">
                <span
                  class="hl-dot"
                  :style="{ background: 'var(--hud-amber)' }"
                />
                待命
                <span class="n">{{ idleCount }}</span>
              </div>
              <div class="hl-row">
                <span
                  class="hl-dot"
                  :style="{ background: 'var(--hud-danger)' }"
                />
                告警
                <span class="n">{{ alarmCount }}</span>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-hd">
            <h3>关键设备监控</h3>
            <span class="panel-tag">{{ deviceTwins.twins.length }}</span>
          </div>
          <WorkshopDeviceTwinPanel
            class="kd-embed"
            @focus-device="onFocusDevice"
          />
        </section>

        <section class="panel">
          <div class="panel-hd">
            <h3>实时事件</h3>
            <span class="panel-tag">{{ ticker.length }}</span>
          </div>
          <div class="event-list">
            <div
              v-for="(t, i) in [...ticker].reverse()"
              :key="`${t.at}-${i}`"
              class="event-row"
            >
              <span class="ev-time">{{ fmtTime(t.at) }}</span>
              <span
                class="ev-name"
                :title="t.agentName"
              >{{ t.agentName }}</span>
              <span
                class="ev-text"
                :title="t.text"
              >{{ t.text }}</span>
            </div>
            <div
              v-if="!ticker.length"
              class="event-empty"
            >
              事件总线待命
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-hd">
            <h3>3D 视图导航</h3>
          </div>
          <div
            v-if="minimap && miniView"
            class="mm-body"
          >
            <div class="mm-wrap">
              <svg
                :viewBox="`${miniView.ox} ${miniView.oy} ${miniView.winW} ${miniView.winH}`"
                class="mini-svg"
                role="img"
                aria-label="镜头居中导航图,点击跳转,拖动平移镜头"
                @click="onMinimapClick"
                @pointerdown="onMinimapDown"
                @pointermove="onMinimapMove"
                @pointerup="onMinimapUp"
                @pointercancel="onMinimapUp"
                @pointerleave="onMinimapUp"
              >
                <rect
                  :x="miniView.ox"
                  :y="miniView.oy"
                  :width="miniView.winW"
                  :height="miniView.winH"
                  fill="#060b13"
                />
                <circle
                  v-for="b in minimap.blocks"
                  :key="`b-${b.name}`"
                  :cx="b.x * minimap.world.w"
                  :cy="b.y * minimap.world.h"
                  :rx="(b.rx ?? 0.04) * minimap.world.w"
                  :ry="(b.rz ?? 0.03) * minimap.world.h"
                  :fill="toHex(b.color)"
                  fill-opacity="0.12"
                  :stroke="toHex(b.color)"
                  stroke-opacity="0.6"
                  stroke-width="3"
                />
                <rect
                  v-for="d in minimap.devices"
                  :key="`d-${d.x.toFixed(4)}-${d.y.toFixed(4)}`"
                  :x="d.x * minimap.world.w - 23"
                  :y="d.y * minimap.world.h - 23"
                  width="46"
                  height="46"
                  rx="6"
                  :fill="toHex(d.color)"
                  opacity="0.95"
                />
                <circle
                  v-for="a in minimap.agents"
                  :key="`a-${a.x.toFixed(4)}-${a.y.toFixed(4)}`"
                  :cx="a.x * minimap.world.w"
                  :cy="a.y * minimap.world.h"
                  r="27"
                  :fill="toHex(a.color)"
                  stroke="rgba(6,10,16,0.7)"
                  stroke-width="6"
                />
                <g class="mini-reticle">
                  <rect
                    :x="miniView.ox + miniView.winW / 2 - 8"
                    :y="miniView.oy + miniView.winH / 2 - 8"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="#35e0a0"
                    stroke-width="4"
                  />
                </g>
              </svg>
            </div>
            <div class="mm-col">
              <button
                class="vp-tool"
                title="重置视角"
                @click="onResetView"
              >
                重
              </button>
              <button
                class="vp-tool"
                title="缩小"
                @click="scene3dRef?.zoomBy(0.25)"
              >
                −
              </button>
              <button
                class="vp-tool"
                title="放大"
                @click="scene3dRef?.zoomBy(-0.25)"
              >
                ＋
              </button>
            </div>
          </div>
          <div class="mm-meta mono">
            {{ blockCount }} 领地 · {{ minimap.devices?.length ?? 0 }} 设备
          </div>
        </section>
      </aside>
    </div>

    <!-- ================= 状态栏 ================= -->
    <footer class="statusbar">
      <span>
        <span
          class="sb-dot"
          :class="{ red: conn.state !== 'open' }"
        />系统状态 <b>{{ conn.state === 'open' ? '正常' : syncing ? '同步中' : '离线' }}</b>
      </span>
      <span>
        领地 {{ blockCount }} · 精魂 {{ agentCount }} · 设备 {{ deviceCount }}
      </span>
      <span class="sb-lat mono">
        {{ fps }} FPS
      </span>
      <span class="copy">
        © 2026 ABO · DIGITAL TWIN · 演示数据为模拟信号
      </span>
    </footer>

    <!-- 加载遮罩(全页) -->
    <div
      v-if="!ready"
      data-hud="town-loading"
      class="loading-mask"
    >
      <div class="loading-spinner" />
      <span class="loading-text">正在铺设数字孪生空间…</span>
    </div>
  </div>
</template>
