# ============================================================
# AgentWorkShop 数采基础设施(DAQ infrastructure)
# ------------------------------------------------------------
# 与 config.yml `daq:` 段默认一致;项目启动时若端口不通且存在 Docker,
# 服务端自动执行 `docker compose up -d daq-mosquitto daq-timescale daq-minio`。
#   - daq-mosquitto:标准 MQTT 3.1.1/5 broker(数采下沉队列)
#   - daq-timescale:TimescaleDB(时序数据/帧元数据持久化;named volume 常驻)
#   - daq-minio:    S3 兼容对象存储(图像帧像素;named volume 常驻)
# 手动启动(凭据必须显式提供,仓库不再内置口令):
#   docker compose --env-file <AW_DATA_DIR>/daq-infra-credentials.env up -d
#   (服务端首次启动会生成该文件;或自行 export AW_DAQ_TIMESCALE_PASSWORD /
#    AW_DAQ_OBJECTSTORE_ACCESSKEY / AW_DAQ_OBJECTSTORE_SECRETKEY)
# 端口只绑 127.0.0.1:跨机部署请显式改绑定并启用 TLS/账号(audit P0-5,2026-10-30)。
# ============================================================
services:
  daq-mosquitto:
    image: eclipse-mosquitto:2
    container_name: awshop-daq-mosquitto
    # no-auth 配置:内网/开发态;生产请挂载自定义 mosquitto.conf 启用鉴权/TLS。
    # 2026-10-28(S13):默认只绑 127.0.0.1,避免同网段任意主机向队列注入样本;
    # 跨机部署请显式改回 0.0.0.0 并同时启用 broker 账号/TLS。
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "127.0.0.1:1883:1883"   # 与 config.yml daq.mqtt.port 一致
    restart: unless-stopped

  daq-timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: awshop-daq-timescale
    # TSL license(自托管免费):列存压缩(compression policy)是 Community 特性,
    # 默认 apache license 下 ALTER TABLE ... SET(timescaledb.compress) 直接报错
    # (P0-3;服务端逐条守护只告警不阻断,但要真开压缩必须用本参数启动)。
    command: ["postgres", "-c", "timescaledb.license=timescale"]
    # ⚠️ 必须显式放大 /dev/shm:Docker 默认只给 64MB,而 PostgreSQL 的并行查询
    # 会按需扩容共享内存段 —— 不够时报的错是
    #   could not resize shared memory segment "...": No space left on device
    # 这句话看起来像"磁盘满了",实际是 shm 满了,极难排查(实测在回退账本的
    # 兜底评估查询上稳定复现,而宿主机还剩 230GB)。512MB 是 Postgres 官方镜像文档的建议值。
    shm_size: 512mb
    environment:
      POSTGRES_USER: postgres        # config.yml daq.timescale.user
      POSTGRES_PASSWORD: ${AW_DAQ_TIMESCALE_PASSWORD:?AW_DAQ_TIMESCALE_PASSWORD 未设置:见服务端数据目录 daq-infra-credentials.env 或自行 export}
      POSTGRES_DB: awshop            # config.yml daq.timescale.database
    ports:
      - "127.0.0.1:5432:5432"        # 与 config.yml daq.timescale.port 一致;仅本机可连
    volumes:
      - awshop-daq-tsdata:/var/lib/postgresql/data
    restart: unless-stopped

  daq-minio:
    image: minio/minio:latest
    container_name: awshop-daq-minio
    # S3 兼容对象存储:图像帧像素落这里,Timescale 只存元数据(daq_frames.meta.objectKey)
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AW_DAQ_OBJECTSTORE_ACCESSKEY:?AW_DAQ_OBJECTSTORE_ACCESSKEY 未设置}
      MINIO_ROOT_PASSWORD: ${AW_DAQ_OBJECTSTORE_SECRETKEY:?AW_DAQ_OBJECTSTORE_SECRETKEY 未设置}
    ports:
      - "127.0.0.1:9000:9000"        # S3 API(与 config.yml daq.objectstore.port 一致;仅本机可连)
    # Web 控制台(9001)默认不 publish:需要调试时用
    #   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
    # 或临时 `docker port awshop-daq-minio 9001` 走容器网络访问。
    volumes:
      - awshop-daq-objdata:/data
    restart: unless-stopped

volumes:
  awshop-daq-tsdata:
  awshop-daq-objdata:
