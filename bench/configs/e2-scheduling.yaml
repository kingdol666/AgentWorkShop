# E2 调度三臂：LLM supervise vs 规则引擎 vs 混合
# 锚点：rule 臂复用现有 lead.supervise=null → ruleEngine 路径（scheduler-loop.ts），零新代码即可跑
# hybrid 臂 = LLM 提议 + 规则引擎可行性校验（P3 开发项 D6）
hypothesis: "LLM 调度在多团队/动态目标下 goal 成功率显著高于规则引擎，但 token 成本高一个量级；混合臂以 <30% 额外 token 换取接近 LLM 的成功率"
seed_base: 100
repeats: 20
harness: mock        # 大规模确定性；另跑 glm-5.3-flash / temperature=0 的 N=10 补充组
workloads:
  - { id: W2, daq_nodes: 8, dcw_nodes: 4, interval_ms: 5000, teams: 1 }
  - { id: W3, daq_nodes: 16, dcw_nodes: 8, interval_ms: 1000, teams: 4 }
scheduler_arms: [llm, rule, hybrid]
tasks: [T1, T4, T5]   # T5 目标中途变更对调度器最敏感
faults:
  T5: [goal-change]   # 非协议故障：任务执行 50% 时改写目标
metrics_primary: [goal_success_rate, wasted_subtasks, llm_calls_per_task, tokens_per_task, replan_latency]
outputs:
  - "table-e2-scheduler.csv"
  - "figure-e2-scaling.svg   # goal_success_rate vs teams 数（三臂三条线）"
