# E5 自适应异常检测 vs 固定阈值（算法主线贡献）
# 前置：P3 开发项 D7 —— DAQ 报警链叠加 EMA 基线 + CUSUM 漂移检测，检测事件暴露为新 agent 工具 alarm_insights
# 数据集双轨：a) 模拟器注入漂移（有 ground truth）；b) TEP/SWAT 公开数据集回放（P4 开发项 D8）
hypothesis: "自适应检测相对固定滞回+去抖，检测延迟降低 ≥40%，误报率不升；耦合 Agent 诊断后端到端 MTTR 进一步缩短"
seed_base: 400
repeats: 20
harness: mock
workloads:
  - { id: W2, daq_nodes: 8, dcw_nodes: 4, interval_ms: 1000, teams: 1 }
detector_arms: [threshold, hysteresis, adaptive-ema-cusum]   # threshold=纯阈值, hysteresis=现状, adaptive=新
data_sources:
  - simulator        # F1 漂移注入（多幅度 k∈{1,2,3,5}×窗口）
  - replay-tep       # Tennessee Eastman 回放（P4 接入后启用）
  - replay-swat      # SWaT 攻击场景回放（P4 接入后启用）
tasks: [T2]
metrics_primary: [detection_delay_s, false_alarm_rate, missed_detection_rate, MTTR, diagnosis_correctness]
outputs:
  - "table-e5-detection.csv   # 检测臂 × 数据源 × 4 指标"
  - "figure-e5-roc.svg        # 检测延迟-误报率散点（含 TEP/SWaT 已发表方法引用线）"
