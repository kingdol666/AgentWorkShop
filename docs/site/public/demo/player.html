<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgentWorkShop — 3-minute demo</title>
    <link rel="icon" href="data:,">
    <style>
      :root { color-scheme: light }
      * { box-sizing: border-box }
      html, body { margin: 0; height: 100% }
      body {
        display: flex; align-items: center; justify-content: center; padding: 28px;
        background: radial-gradient(1200px 700px at 18% 12%, #f7fafc 0%, #eef3f7 45%, #e7eef4 100%);
        color: #16222e; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      main { width: min(1180px, 100%) }
      header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px }
      h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .2px }
      .meta { color: #5b6b79; font-size: 13px }
      .player { border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px rgba(22,34,46,.16); background: #000 }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000 }
      footer { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; color: #40515f }
      a { color: #1a7f6b; text-decoration: none }
      a:hover { text-decoration: underline }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#1f8f78"/><path d="M7 16.5 12 7l5 9.5h-2.5L12 11.4l-2.5 5.1z" fill="#fff"/></svg>
        <h1>AgentWorkShop — live product demo</h1>
        <span class="meta">3:00 · 1080p · English interface · EN / 中文 subtitles</span>
      </header>
      <div class="player">
        <video controls preload="metadata" playsinline poster="agentworkshop-core-demo-poster.png">
          <source src="agentworkshop-core-demo.mp4" type="video/mp4">
          <track kind="captions" label="English" srclang="en" src="agentworkshop-core-demo.en.vtt" default>
          <track kind="captions" label="简体中文" srclang="zh-Hans" src="agentworkshop-core-demo.zh-Hans.vtt">
          Your browser does not support embedded video. <a href="agentworkshop-core-demo.mp4">Download the MP4</a>.
        </video>
      </div>
      <footer>
        <a href="agentworkshop-core-demo.mp4">Download MP4</a>
        <a href="agentworkshop-core-demo.en.vtt">English captions</a>
        <a href="agentworkshop-core-demo.zh-Hans.vtt">中文字幕</a>
        <a href="agentworkshop-core-demo-voiceover.mp3">Narration audio</a>
        <a href="https://github.com/kingdol666/AgentWorkShop">GitHub</a>
      </footer>
    </main>
