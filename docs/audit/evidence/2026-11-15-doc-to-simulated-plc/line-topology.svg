  <text x="550" y="224" fill="#9de7c7" font-size="13" text-anchor="middle">闭环目标：克重 32.50 ± 0.35 g</text>
  <rect x="430" y="252" width="240" height="42" rx="8" fill="#241b0e" stroke="#7a5a22"/>
  <text x="550" y="278" fill="#f0cf8e" font-size="13" text-anchor="middle">写入：≤step、≥60s、全量审批</text>
  <rect x="430" y="306" width="240" height="30" rx="8" fill="#161d27" stroke="#37424d"/>
  <text x="550" y="326" fill="#9fb0c0" font-size="12" text-anchor="middle">vector 帧 · 设备语义 · 批次打标</text>

  <g stroke-width="2" fill="none">
