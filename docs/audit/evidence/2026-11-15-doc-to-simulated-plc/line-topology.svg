  <text x="550" y="62" fill="#8b98a5" font-size="13" text-anchor="middle">测试夹具：五协议模拟 PLC → DAQ/DCW → Channel 闭环；虚拟→真实仅换端点/寄存器</text>

  <rect x="390" y="95" width="320" height="260" rx="18" fill="#17212b" stroke="#35e0a0" stroke-width="2"/>
