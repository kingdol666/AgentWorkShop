<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>星际撤离 ARK-7</title>
<style>html,body{margin:0;height:100%;background:#04050b;overflow:hidden}#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:crosshair}canvas{display:block}</style>
</head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
(function(){
"use strict";
var c=document.getElementById("c"),x=c.getContext("2d"),W=1280,H=720,TAU=Math.PI*2,T=0;
function R(a,b){return a+Math.random()*(b-a)}
function CL(v,a,b){return v<a?a:v>b?b:v}
function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function poly(cx,cy,n,r,rot){x.beginPath();for(var i=0;i<n;i++){var a=i/n*TAU+(rot||0),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;if(i)x.lineTo(px,py);else x.moveTo(px,py)}x.closePath()}
function txt(s,px,py,sz,col,al,w){x.font=(w||500)+" "+sz+'px system-ui,"Segoe UI",sans-serif';x.fillStyle=col;x.textAlign=al||"left";x.fillText(s,px,py)}
function dim(a){x.fillStyle="rgba(4,5,11,"+a+")";x.fillRect(0,0,W,H)}
function bar(px,py,w,h,v,col){x.fillStyle="rgba(255,255,255,.09)";x.fillRect(px,py,w,h);x.fillStyle=col;x.fillRect(px,py,w*CL(v,0,1),h)}

var LV=[{n:"1 残骸带",q:12,p:85,c:"#ff8a2b",a:"#ffd166"},{n:"2 离子风暴",q:15,p:100,c:"#7a5cff",a:"#3fe0ff"},{n:"3 虫群封锁",q:18,p:120,c:"#8dff2b",a:"#2bff9e"}];
var ET={ast:[24,18,20],big:[60,34,60],drone:[36,14,140],hunt:[48,15,220],mine:[12,11,40],larva:[12,10,60],core:[900,72,2500]};
var UP=[{n:"船体修复",d:"船体 +40",f:function(){P.hull=Math.min(P.mh,P.hull+40)}},
{n:"超频火控",d:"射速 +18%",f:function(){P.fmul*=1.18}},
{n:"推进改良",d:"移速 +12%，冲刺冷却 -25%",f:function(){P.sp*=1.12;P.dcd*=.75}},
{n:"引力拾取",d:"营救判定半径 x2",f:function(){P.pk*=2}},
{n:"装甲扩容",d:"船体上限 +25",f:function(){P.mh+=25;P.hull+=25}}];

var P={score:0,hull:100,mh:100,sp:430,fmul:1,dcd:2.2,pk:1},G,hi=0,muted=false,AC=null,MX=640,MY=420,qlv=0;
try{hi=+localStorage.getItem("ark7hi")||0}catch(e){}
var stars=[];for(var i=0;i<170;i++)stars.push({x:R(0,W),y:R(0,H),r:R(.4,1.8),a:R(.12,.85),s:R(6,44)});

function beep(f,d,ty,v){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=ty||"square";o.frequency.value=f;g.gain.value=v||.04;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08)+.03)}catch(e){}}

function blank(l){return{l:l,lt:0,res:0,miss:0,kills:0,combo:0,mult:1,ct:0,px:640,py:600,aim:-1.57,heat:0,lock:0,ft:0,dash:0,dvx:0,dvy:0,dcdT:0,di:0,shk:0,b:[],eb:[],en:[],pd:[],pt:[],rg:[],st:"play",gate:0,ck:0,core:null,qt:1.2,wt:0,wd:1,wind:0,wdir:1,bolt:null,sel:null,msg:"",mT:0}}
G=blank(1);G.st="title";

var K={},md=false;
addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();K[k]=1;
 if(k==" "||k.indexOf("arrow")==0)e.preventDefault();
 if(k=="escape"||k=="p"){if(G.st=="play")G.st="pause";else if(G.st=="pause")G.st="play"}
 if(k=="m")muted=!muted;
 if(k=="r"){newGame(1);return}
 if(G.st=="title"&&(k=="enter"||k==" ")){newGame(qlv||1);return}
 if(G.st=="upgrade"&&"123".indexOf(k)>=0){pick(+k-1);return}
 if((G.st=="over"||G.st=="win")&&(k=="enter"||k==" "))newGame(1);
});
addEventListener("keyup",function(e){K[e.key.toLowerCase()]=0});
function mp(e){var r=c.getBoundingClientRect();MX=(e.clientX-r.left)*(W/r.width);MY=(e.clientY-r.top)*(H/r.height)}
c.addEventListener("mousemove",mp);
c.addEventListener("mousedown",function(e){
 mp(e);md=true;
 if(G.st=="title")newGame(qlv||1);
 else if(G.st=="upgrade")clickCard();
 else if(G.st=="over"||G.st=="win")newGame(1);
});
addEventListener("mouseup",function(){md=false});
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+"px";c.style.height=H*s+"px"}
addEventListener("resize",fit);

function newGame(l){P={score:0,hull:100,mh:100,sp:430,fmul:1,dcd:2.2,pk:1};startLevel(l||1)}
function startLevel(l){G=blank(l);G.di=1.4;P.hull=CL(P.hull,25,P.mh);G.msg=LV[l-1].n+" 出发";G.mT=2.6;saveHi()}
function saveHi(){if(P.score>hi){hi=P.score;try{localStorage.setItem("ark7hi",hi)}catch(e){}}}
function rank(s){return s>=20000?"S":s>=14000?"A":s>=9000?"B":"C"}

function spawnEn(t,px,py,vx,vy){
 var s=ET[t],e={t:t,x:px,y:py,vx:vx||0,vy:vy||0,hp:s[0],mh:s[0],r:s[1],sc:s[2],age:0,cd:R(.8,2),sd:R(2,3),a:R(0,TAU),spin:R(-2.2,2.2),ph:R(0,TAU),v:null};
 if(t=="ast"||t=="big"){e.v=[];for(var i=0;i<9;i++)e.v.push(R(.78,1.16))}
 G.en.push(e);return e;
}
function fireAt(e,sp,dmg){var a=Math.atan2(G.py-e.y,G.px-e.x);G.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,d:dmg,l:6})}
function kill(e){
 if(e.dead)return;
 e.dead=1;P.score+=e.sc;G.kills++;
 var big=e.t=="core",col=big?"#ff3b6b":LV[G.l-1].a,n=big?70:16,sp=big?520:290;
 for(var i=0;i<n;i++)G.pt.push({x:e.x,y:e.y,vx:R(-1,1)*sp,vy:R(-1,1)*sp,l:R(.4,1.1),c:i%3?col:"#fff"});
 G.rg.push({x:e.x,y:e.y,r:e.r*1.4,c:col,l:1});
 G.shk=Math.min(24,G.shk+(big?20:3));
 beep(big?70:150,big?.5:.09,"sawtooth",.05);
 if(big){G.ck=1;G.core=null;G.msg="虫巢核心已摧毁 跃迁门开启";G.mT=3.5}
}
function dmgEn(e,d,bx,by){e.hp-=d;for(var i=0;i<3;i++)G.pt.push({x:bx,y:by,vx:R(-160,160),vy:R(-160,160),l:.28,c:"#bff6ff"});if(e.hp<=0)kill(e)}
function hurt(n){
 if(G.di>0||G.st!="play")return;
 P.hull-=n;G.di=.9;G.shk=Math.min(22,G.shk+9);
 for(var i=0;i<16;i++)G.pt.push({x:G.px,y:G.py,vx:R(-330,330),vy:R(-330,330),l:R(.3,.7),c:"#ff6b6b"});
 beep(90,.16,"square",.06);
 if(P.hull<=0){
  P.hull=0;G.st="over";saveHi();
  for(var i=0;i<50;i++)G.pt.push({x:G.px,y:G.py,vx:R(-520,520),vy:R(-520,520),l:R(.4,1.2),c:i%2?"#ff5a5a":"#fff"});
  G.shk=24;beep(60,.6,"sawtooth",.06);
 }
}
function fire(){
 var a=G.aim,ca=Math.cos(a),sa=Math.sin(a),ox=-sa*5,oy=ca*5;
 for(var i=-1;i<=1;i+=2)G.b.push({x:G.px+ca*16+ox*i,y:G.py+sa*16+oy*i,vx:ca*950,vy:sa*950,r:4,d:12,l:1.2});
 G.heat=CL(G.heat+9,0,100);G.shk=Math.min(6,G.shk+1.2);
}
function levelClear(){
 var L=LV[G.l-1],tb=CL(Math.floor((L.p-G.lt)*25),0,1000);
 P.score+=Math.max(0,500+tb+Math.floor(P.hull)*8-G.miss*50);
 for(var i=0;i<40;i++)G.pt.push({x:W/2,y:78,vx:R(-320,320),vy:R(-320,320),l:R(.5,1.2),c:"#7cf"});
 G.rg.push({x:W/2,y:78,r:60,c:"#7cf",l:1});
 beep(520,.2,"triangle",.05);saveHi();
 if(G.l>=3){G.st="win";return}
 var a=UP.slice();
 for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
 G.sel=a.slice(0,3);G.st="upgrade";
}
function pick(i){if(G.st!="upgrade"||!G.sel||!G.sel[i])return;G.sel[i].f();startLevel(G.l+1)}
function clickCard(){if(!G.sel)return;for(var i=0;i<3;i++){var r=G.sel[i]&&G.sel[i].rect;if(r&&MX>r[0]&&MX<r[0]+r[2]&&MY>r[1]&&MY<r[1]+r[3]){pick(i);return}}}

function storm(dt){
 if(G.l!=2)return;
 if(G.wind>0){
  G.wind-=dt;G.px=CL(G.px+G.wdir*270*dt,22,W-22);
  for(var i=0;i<3;i++)G.pt.push({x:R(0,W),y:R(0,H),vx:G.wdir*320,vy:0,l:.35,c:"#3fe0ff"});
  if(G.wind<=0){G.msg="";G.mT=0}
 }
 if(G.bolt){
  G.bolt.t+=dt;
  if(G.bolt.t>1.5&&G.bolt.t<1.85&&Math.abs(G.px-G.bolt.x)<36)hurt(14);
  if(G.bolt.t>1.95)G.bolt=null;
 }
 if(G.lt>20&&(G.wt-=dt)<=0){
  G.wt=12;
  if(G.wd>0){G.bolt={x:R(150,W-150),t:0};beep(300,.2,"sine",.04)}
  else{G.wind=3;G.wdir=Math.random()<.5?-1:1;G.msg="离子风袭 稳住船身";G.mT=2.6;beep(140,.5,"sine",.05)}
  G.wd*=-1;
 }
}
function spawner(dt){
 var t=G.lt,l=G.l;
 function rp(ty,p){if(Math.random()<dt*p)spawnEn(ty,R(60,W-60),-40,R(-40,40),R(60,120))}
 if(l==1){rp("ast",1.15);if(t>12)rp("drone",.5);if(t>38)rp("hunt",.4);if(t>20&&Math.random()<dt*.25)spawnEn("big",R(90,W-90),-60,R(-20,20),70)}
 else if(l==2){rp("ast",.6);rp("mine",.5);rp("drone",.55);if(t>25)rp("hunt",.35)}
 else{rp("larva",1.6);rp("hunt",.45);rp("mine",.45);if(t>20)rp("ast",.4)}
}
function updP(dt){
 for(var i=G.pt.length;i--;){var p=G.pt[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt;if(p.l<=0)G.pt.splice(i,1)}
 for(var i=G.rg.length;i--;){G.rg[i].l-=dt*1.6;if(G.rg[i].l<=0)G.rg.splice(i,1)}
 while(G.pt.length>300)G.pt.shift();
}

function step(dt){
 T+=dt;updP(dt);
 if(G.st!="play")return;
 G.lt+=dt;
 if(G.di>0)G.di-=dt;
 if(G.dcdT>0)G.dcdT-=dt;
 if(G.shk>0)G.shk=Math.max(0,G.shk-30*dt);
 if(G.ct>0&&(G.ct-=dt)<=0){G.combo=0;G.mult=1}
 if(G.mT>0)G.mT-=dt;
 G.aim=Math.atan2(MY-G.py,MX-G.px);
 storm(dt);
 var ax=(K["d"]||K["arrowright"]?1:0)-(K["a"]||K["arrowleft"]?1:0);
 var ay=(K["s"]||K["arrowdown"]?1:0)-(K["w"]||K["arrowup"]?1:0);
 var m=Math.hypot(ax,ay);if(m){ax/=m;ay/=m}
 if((K["shift"]||K["k"])&&G.dcdT<=0&&G.dash<=0){
  G.dcdT=P.dcd;G.dash=.16;G.di=.3;
  if(m){G.dvx=ax;G.dvy=ay}else{G.dvx=Math.cos(G.aim);G.dvy=Math.sin(G.aim)}
  beep(190,.1,"sawtooth",.045);
  for(var i=0;i<14;i++)G.pt.push({x:G.px,y:G.py,vx:R(-170,170),vy:R(-170,170),l:.4,c:"#7ff"});
 }
 if(G.dash>0){G.dash-=dt;G.px+=G.dvx*1350*dt;G.py+=G.dvy*1350*dt;if(Math.random()<.9)G.pt.push({x:G.px,y:G.py,vx:R(-20,20),vy:R(-20,20),l:.32,c:"#5fe"})}
 else{G.px+=ax*P.sp*dt;G.py+=ay*P.sp*dt}
 G.px=CL(G.px,22,W-22);G.py=CL(G.py,22,H-22);

 G.heat=CL(G.heat-32*dt,0,100);
 if(G.heat>=100)G.lock=1;else if(G.heat<=30)G.lock=0;
 if(G.ft>0)G.ft-=dt;
 if((K[" "]||K["j"]||md)&&!G.lock&&G.ft<=0){G.ft=.154/P.fmul;fire()}

 var L=LV[G.l-1];
 if(G.res<L.q){G.qt-=dt;if(G.qt<=0){G.qt=R(.85,1.3);G.pd.push({x:R(70,W-70),y:-24,vy:R(90,130),ph:R(0,TAU)})}}
 if(G.l==3&&G.res>=L.q&&!G.core&&!G.ck){G.core=spawnEn("core",W/2,-90,0,0);G.msg="虫巢核心出现 击毁它";G.mT=3.2}
 G.gate=(G.res>=L.q&&(G.l<3||G.ck))?1:0;

 spawner(dt);

 for(var i=G.pd.length;i--;){
  var p=G.pd[i];p.y+=p.vy*dt;p.ph+=dt*3;
  if(D(p,G)<30*P.pk){
   G.pd.splice(i,1);G.res++;G.combo++;G.ct=6;
   G.mult=[1,1.25,1.5,2,2.5][Math.min(4,G.combo>>1)];
   var gain=Math.round(100*G.mult);
   P.score+=gain;
   G.msg="营救 +"+gain+(G.mult>1?" x"+G.mult:"");G.mT=1.1;
   for(var j=0;j<18;j++)G.pt.push({x:p.x,y:p.y,vx:R(-220,220),vy:R(-220,220),l:R(.3,.8),c:"#7dffb0"});
   G.rg.push({x:p.x,y:p.y,r:26,c:"#7dffb0",l:1});
   beep(660,.09,"triangle",.05);beep(880,.11,"triangle",.035);
  }else if(p.y>H+40){
   G.pd.splice(i,1);G.miss++;G.combo=0;G.mult=1;G.ct=0;
   G.msg="漏接逃生舱 -50";G.mT=1.5;beep(110,.18,"square",.05);
  }
 }

 for(var i=G.en.length;i--;){
  var e=G.en[i];e.age+=dt;
  var t=e.t,dx,dy,dd2,s2;
  if(t=="drone"){
   if(e.age<16){if(e.y<138)e.vx=0;else{e.vy=0;e.vx=Math.sin(e.age*1.6+e.ph)*70}}
   else{e.vx=0;e.vy=110}
   if((e.cd-=dt)<=0&&e.y>40&&e.y<H*.75){e.cd=R(1.4,2.1);fireAt(e,240,12)}
  }else if(t=="hunt"||t=="mine"){
   dx=G.px-e.x;dy=G.py-e.y;dd2=Math.hypot(dx,dy)||1;s2=t=="hunt"?340:95;
   e.vx+=dx/dd2*s2*dt;e.vy+=dy/dd2*s2*dt;
   var mx=t=="hunt"?210:105,cs=Math.hypot(e.vx,e.vy);
   if(cs>mx){e.vx*=mx/cs;e.vy*=mx/cs}
  }else if(t=="larva"){
   dx=G.px-e.x;dy=G.py-e.y;dd2=Math.hypot(dx,dy)||1;
   e.vx=dx/dd2*250;e.vy=dy/dd2*250;
  }else if(t=="core"){
   if(e.y<130){e.vy=62;e.vx=0}
   else{e.vx=0;e.vy=0;e.x=W/2+Math.sin(e.age*.5)*320;e.y=132+Math.sin(e.age*1.1)*18}
   if((e.cd-=dt)<=0&&e.age>3){
    e.cd=2.5;G.rg.push({x:e.x,y:e.y,r:44,c:"#ff3b6b",l:1});
    for(var k=0;k<16;k++){var a=k/16*TAU+e.age*.4;G.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,r:6,d:13,l:6})}
    beep(220,.12,"square",.04);
   }
   if((e.sd-=dt)<=0&&e.age>2){e.sd=2.8;for(var k=0;k<3;k++)spawnEn("larva",e.x+R(-50,50),e.y+50,R(-20,20),R(120,170))}
  }
  e.x+=e.vx*dt;e.y+=e.vy*dt;e.a+=e.spin*dt;
  if(e.x<-180||e.x>W+180||e.y>H+160||e.y<-240)G.en.splice(i,1);
 }

 for(var i=G.b.length;i--;){var b=G.b[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)G.b.splice(i,1)}
 for(var i=G.eb.length;i--;){var b=G.eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0||b.x<-70||b.x>W+70||b.y<-70||b.y>H+70)G.eb.splice(i,1)}

 for(var i=G.b.length;i--;){
  var b=G.b[i];
  for(var j=G.en.length;j--;){var e=G.en[j];if(!e.dead&&D(b,e)<e.r+b.r){b.dead=1;dmgEn(e,b.d,b.x,b.y);break}}
  if(b.dead)G.b.splice(i,1);
 }
 for(var i=G.eb.length;i--;){var b=G.eb[i];if(D(b,G)<b.r+13){G.eb.splice(i,1);hurt(b.d)}}
 for(var i=G.en.length;i--;){
  var e=G.en[i];if(e.dead)continue;
  if(D(e,G)<e.r+13){
   var t=e.t;
   if(t=="larva"){hurt(18);kill(e)}
   else if(t=="mine"){hurt(26);kill(e)}
   else hurt(t=="hunt"?22:t=="big"?30:t=="core"?34:18);
  }
 }
 for(var i=G.en.length;i--;)if(G.en[i].dead)G.en.splice(i,1);

 if(G.gate&&Math.hypot(G.px-W/2,G.py-78)<52){levelClear();return}
}

function drawPlayer(){
 if(G.di>0&&Math.floor(T*22)%2===0)return;
 x.save();x.translate(G.px,G.py);x.rotate(G.aim+Math.PI/2);
 x.fillStyle="rgba(255,150,60,.9)";
 x.beginPath();x.moveTo(-7,10);x.lineTo(-3,10);x.lineTo(-5,10+R(12,24));x.closePath();x.fill();
 x.beginPath();x.moveTo(3,10);x.lineTo(7,10);x.lineTo(5,10+R(12,24));x.closePath();x.fill();
 x.beginPath();x.moveTo(0,-18);x.lineTo(11,12);x.lineTo(0,7);x.lineTo(-11,12);x.closePath();
 x.fillStyle="#0b2230";x.fill();x.strokeStyle="#8ee7ff";x.lineWidth=1.6;x.stroke();
 x.beginPath();x.moveTo(0,-11);x.lineTo(3.6,2);x.lineTo(-3.6,2);x.closePath();x.fillStyle="#3fe0ff";x.fill();
 x.restore();
}

function drawEn(e){
 var col=LV[G.l-1].a,t=e.t,i,a,px,py,rr;
 if(t=="ast"||t=="big"){
  x.beginPath();
  for(i=0;i<9;i++){a=i/9*TAU+e.a;rr=e.r*e.v[i];px=e.x+Math.cos(a)*rr;py=e.y+Math.sin(a)*rr;if(i)x.lineTo(px,py);else x.moveTo(px,py)}
  x.closePath();x.fillStyle="#0d1017";x.fill();x.strokeStyle=col;x.lineWidth=1.6;x.stroke();
 }else if(t=="drone"){
  x.save();x.translate(e.x,e.y);poly(0,0,6,e.r,e.age*.8);x.fillStyle="#0d1017";x.fill();x.strokeStyle=col;x.lineWidth=1.5;x.stroke();
  x.fillStyle=col;x.beginPath();x.arc(0,0,3.5,0,TAU);x.fill();x.restore();
 }else if(t=="hunt"){
  x.save();x.translate(e.x,e.y);x.rotate(Math.atan2(G.py-e.y,G.px-e.x));
  x.beginPath();x.moveTo(e.r*1.35,0);x.lineTo(-e.r,-e.r*.85);x.lineTo(-e.r*.4,0);x.lineTo(-e.r,e.r*.85);x.closePath();
  x.fillStyle="#180a12";x.fill();x.strokeStyle="#ff6b9d";x.lineWidth=1.6;x.stroke();x.restore();
 }else if(t=="mine"){
  x.strokeStyle="#ff9a3c";x.lineWidth=1.5;x.beginPath();x.arc(e.x,e.y,e.r,0,TAU);x.stroke();
  for(i=0;i<6;i++){a=i/6*TAU+e.a;x.beginPath();x.moveTo(e.x+Math.cos(a)*e.r,e.y+Math.sin(a)*e.r);x.lineTo(e.x+Math.cos(a)*(e.r+7),e.y+Math.sin(a)*(e.r+7));x.stroke()}
  x.fillStyle="rgba(255,154,60,"+(.45+Math.sin(T*9+e.ph)*.55)+")";x.beginPath();x.arc(e.x,e.y,4,0,TAU);x.fill();
 }else if(t=="larva"){
  x.save();x.translate(e.x,e.y);x.rotate(Math.atan2(G.py-e.y,G.px-e.x));
  x.beginPath();x.moveTo(e.r*1.2,0);x.lineTo(-e.r,e.r*.9);x.lineTo(-e.r*.45,0);x.lineTo(-e.r,-e.r*.9);x.closePath();
  x.fillStyle="#12200a";x.fill();x.strokeStyle="#8dff2b";x.lineWidth=1.3;x.stroke();x.restore();
 }else{
  x.save();x.translate(e.x,e.y);
  poly(0,0,6,e.r,e.age*.25);x.fillStyle="rgba(60,0,20,.85)";x.fill();x.strokeStyle="#ff3b6b";x.lineWidth=2;x.stroke();
  poly(0,0,3,e.r*.5,-e.age*.5);x.strokeStyle="#ff8fb0";x.lineWidth=1.4;x.stroke();
  x.fillStyle="rgba(255,59,107,"+(.4+Math.sin(T*6)*.25)+")";x.beginPath();x.arc(0,0,e.r*.22,0,TAU);x.fill();x.restore();
  bar(e.x-e.r*1.2,e.y-e.r-20,e.r*2.4,5,e.hp/e.mh,"#ff3b6b");
 }
 if(t!="core"&&e.hp<e.mh)bar(e.x-e.r*.95,e.y-e.r-9,e.r*1.9,3,e.hp/e.mh,col);
}

function drawPod(p){
 x.save();x.translate(p.x,p.y);
 var pu=.35+Math.sin(p.ph*2)*.55;
 x.globalAlpha=pu*.45;x.fillStyle="#7dffb0";x.beginPath();x.arc(0,0,22,0,TAU);x.fill();x.globalAlpha=1;
 x.strokeStyle="#7dffb0";x.lineWidth=1.5;x.beginPath();x.ellipse(0,0,9,13,0,0,TAU);
 x.fillStyle="#0b1a12";x.fill();x.stroke();
 x.fillStyle="#7dffb0";x.beginPath();x.arc(0,-4,3,0,TAU);x.fill();
 x.strokeStyle="rgba(125,255,176,.35)";x.lineWidth=1;x.beginPath();x.moveTo(0,-13);x.lineTo(0,-26);x.stroke();
 x.restore();
}
function drawGate(){
 if(!G.gate)return;
 var cx=W/2,cy=78,i,a;
 x.save();
 x.globalAlpha=.16+Math.sin(T*4)*.08;x.fillStyle="#78e8ff";x.beginPath();x.arc(cx,cy,46,0,TAU);x.fill();
 x.globalAlpha=.55+Math.sin(T*4)*.2;x.strokeStyle="#78e8ff";x.lineWidth=2;
 x.beginPath();x.arc(cx,cy,46,0,TAU);x.stroke();x.beginPath();x.arc(cx,cy,30,0,TAU);x.stroke();
 x.globalAlpha=1;x.strokeStyle="#eafcff";x.lineWidth=1;
 for(i=0;i<8;i++){a=T*1.4+i/8*TAU;x.beginPath();x.moveTo(cx+Math.cos(a)*30,cy+Math.sin(a)*30);x.lineTo(cx+Math.cos(a)*46,cy+Math.sin(a)*46);x.stroke()}
 x.restore();
}
function hud(){
 var L=LV[G.l-1],i;
 bar(24,26,220,12,P.hull/P.mh,"#5ef0b0");
 txt("船体 "+Math.ceil(P.hull)+" / "+P.mh,24,58,13,"#8fe8c0");
 bar(24,68,220,7,G.heat/100,G.lock?"#ff4d4d":"#ffb347");
 txt(G.lock?"过热冷却中":"武器热量",24,92,11,G.lock?"#ff8080":"#7d8ea3");
 if(G.dcdT>0){x.fillStyle="rgba(255,255,255,.09)";x.fillRect(24,100,120,4);x.fillStyle="#78e8ff";x.fillRect(24,100,120*(1-G.dcdT/P.dcd),4)}
 txt(L.n,W/2,38,19,L.a,"center",700);
 txt("营救 "+G.res+" / "+L.q,W/2,64,15,"#cfe8ff","center");
 txt("用时 "+Math.floor(G.lt)+"s 参考 "+L.p+"s",W/2,86,11,"#6d7f93","center");
 txt(P.score.toLocaleString(),W-24,40,26,"#fff","right",700);
 txt("最高 "+hi.toLocaleString(),W-24,64,12,"#6d7f93","right");
 if(G.mult>1)txt("x"+G.mult+" 连击 "+G.combo,W-24,92,14,L.a,"right",700);
 if(G.mT>0){x.globalAlpha=CL(G.mT,0,1);txt(G.msg,W/2,H-92,18,"#fff","center",600);x.globalAlpha=1}
}
function overlay(){
 var i,it,cx,cy,w,h,on;
 if(G.st=="title"){
  dim(.72);
  txt("星际撤离",W/2,244,66,"#eafcff","center",800);
  txt("ARK-7 三关突围",W/2,292,20,"#78e8ff","center");
  txt("WASD/方向键 移动   鼠标瞄准   空格/J/左键 开火",W/2,384,16,"#9fb4c8","center");
  txt("Shift/K 冲刺(无敌0.3s)   Esc/P 暂停   M 静音   R 重开",W/2,414,16,"#9fb4c8","center");
  txt("营救下落逃生舱攒够配额，飞入顶部跃迁门进入下一关",W/2,464,15,"#7d8ea3","center");
  txt("第 3 关需先击毁虫巢核心 900HP",W/2,492,15,"#7d8ea3","center");
  if(Math.sin(T*4)>-.3)txt("按 Enter 或点击开始",W/2,572,20,"#ffd166","center",700);
 }else if(G.st=="pause"){
  dim(.62);
  txt("已暂停",W/2,320,46,"#eafcff","center",800);
  txt("Esc/P 继续    R 重开",W/2,372,16,"#9fb4c8","center");
 }else if(G.st=="upgrade"){
  dim(.8);
  txt("跃迁前补给",W/2,148,40,"#eafcff","center",800);
  txt("三选一 点击或按 1/2/3",W/2,186,15,"#7d8ea3","center");
  for(i=0;i<3;i++){
   it=G.sel[i];cx=W/2+(i-1)*310;cy=390;w=262;h=200;
   it.rect=[cx-w/2,cy-h/2,w,h];
   on=MX>cx-w/2&&MX<cx+w/2&&MY>cy-h/2&&MY<cy+h/2;
   x.fillStyle=on?"rgba(120,232,255,.10)":"rgba(255,255,255,.035)";x.fillRect(cx-w/2,cy-h/2,w,h);
   x.strokeStyle=on?"#78e8ff":"rgba(120,232,255,.45)";x.lineWidth=on?2:1;x.strokeRect(cx-w/2,cy-h/2,w,h);
   txt(String(i+1),cx,cy-52,20,"#78e8ff","center",700);
   txt(it.n,cx,cy-14,22,"#eafcff","center",700);
   txt(it.d,cx,cy+34,14,"#9fb4c8","center");
   txt("选择",cx,cy+82,13,on?"#78e8ff":"#4d6274","center");
  }
 }else{
  var win=G.st=="win";
  dim(.82);
  txt(win?"撤离成功":"GAME OVER",W/2,238,58,win?"#5ef0b0":"#ff5a5a","center",800);
  txt(win?"ARK-7 冲破虫群封锁":"船体归零 撤离失败",W/2,286,20,"#9fb4c8","center");
  txt("总分 "+P.score.toLocaleString(),W/2,374,34,"#eafcff","center",700);
  txt("评级 "+rank(P.score),W/2,424,28,"#ffd166","center",700);
  txt("营救 "+G.res+" 击毁 "+G.kills+" 漏接 "+G.miss,W/2,464,15,"#7d8ea3","center");
  txt("历史最高 "+hi.toLocaleString(),W/2,492,13,"#6d7f93","center");
  if(Math.sin(T*4)>-.3)txt("按 R 重新开始",W/2,566,20,"#78e8ff","center",700);
 }
}
function draw(){
 var L=LV[G.l-1],i,s,sy,a;
 x.setTransform(1,0,0,1,0,0);
 x.fillStyle="#04050b";x.fillRect(0,0,W,H);
 var g=x.createRadialGradient(W/2,H*.05,40,W/2,H*.05,H*1.15);
 g.addColorStop(0,L.c+"38");g.addColorStop(.5,L.c+"10");g.addColorStop(1,"rgba(0,0,0,0)");
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle="#cfe8ff";
 for(i=0;i<stars.length;i++){s=stars[i];sy=(s.y+T*s.s)%H;x.globalAlpha=s.a;x.fillRect(s.x,sy,s.r,s.r)}
 x.globalAlpha=1;

 x.save();
 if(G.shk>0)x.translate(R(-G.shk,G.shk),R(-G.shk,G.shk));
 if(G.wind>0){x.globalAlpha=.05;x.fillStyle="#3fe0ff";x.fillRect(0,0,W,H);x.globalAlpha=1}
 if(G.bolt){
  var b=G.bolt;
  if(b.t<1.5){
   x.globalAlpha=.12+Math.sin(b.t*30)*.06;x.fillStyle="#3fe0ff";x.fillRect(b.x-36,0,72,H);
   x.globalAlpha=.85;x.strokeStyle="#3fe0ff";x.lineWidth=1.5;x.setLineDash([9,11]);
   x.beginPath();x.moveTo(b.x,0);x.lineTo(b.x,H);x.stroke();x.setLineDash([]);
  }else{
   x.globalAlpha=1;x.fillStyle="#dffcff";x.fillRect(b.x-24,0,48,H);
   x.fillStyle="#fff";x.fillRect(b.x-8,0,16,H);
  }
  x.globalAlpha=1;
 }
 drawGate();
 for(i=0;i<G.pd.length;i++)drawPod(G.pd[i]);

 x.lineCap="round";
 for(i=0;i<G.b.length;i++){var bu=G.b[i];x.strokeStyle="#9ff6ff";x.lineWidth=3;x.beginPath();x.moveTo(bu.x,bu.y);x.lineTo(bu.x-bu.vx*.013,bu.y-bu.vy*.013);x.stroke()}
 for(i=0;i<G.eb.length;i++){var be=G.eb[i];x.fillStyle="#ff5a8a";x.beginPath();x.arc(be.x,be.y,be.r,0,TAU);x.fill();x.strokeStyle="#ffd0e0";x.lineWidth=1;x.stroke()}
 for(i=0;i<G.en.length;i++)drawEn(G.en[i]);
 if(G.st!="title")drawPlayer();
 for(i=0;i<G.pt.length;i++){var p=G.pt[i];x.globalAlpha=CL(p.l*2,0,1);x.fillStyle=p.c;x.fillRect(p.x-1.5,p.y-1.5,3,3)}
 x.globalAlpha=1;
 for(i=0;i<G.rg.length;i++){var r=G.rg[i];x.globalAlpha=CL(r.l,0,1);x.strokeStyle=r.c;x.lineWidth=2;x.beginPath();x.arc(r.x,r.y,r.r*(1-r.l)*2.4+4,0,TAU);x.stroke()}
 x.globalAlpha=1;
 x.restore();

 if(G.st!="title")hud();
 overlay();
}

var last=0,acc=0;
function loop(ts){
 if(!last)last=ts;
 var d=(ts-last)/1000;last=ts;
 if(d>.25)d=.25;
 acc+=d;
 var n=0;
 while(acc>=1/60&&n<6){step(1/60);acc-=1/60;n++}
 draw();
 requestAnimationFrame(loop);
}

try{qlv=CL(parseInt((location.search.match(/[?&]level=(\d+)/)||[])[1]||"0",10)||0,1,3)}catch(e){}
fit();
if(qlv)newGame(qlv);
requestAnimationFrame(loop);

window.__game={
 get G(){return G},get P(){return P},
 state:function(){return G.st},
 score:function(){return P.score},
 start:function(l){newGame(l||1)},
 setLevel:function(l){newGame(CL(l||1,1,3))},
 pause:function(){if(G.st=="play")G.st="pause";else if(G.st=="pause")G.st="play"},
 win:function(){G.l=3;levelClear()},
 hurt:hurt,
 addScore:function(v){P.score+=v},
 rescue:function(n){G.res+=n||1}
};
})();
</script>
