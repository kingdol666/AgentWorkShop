<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AgentWorkShop">
  <!--
    Application badge: a machined plate with the mark cut in paper-white.
    Plate geometry is fixed for Windows: 512 canvas, 104 radius (20 %), 3 px bezel.
    The gradient is a 2.6 % lift, not a glow — it should read as material, not lighting.
    Rebuilt by `node scripts/desktop-brand.mjs`; never hand-export the .ico.
  -->
  <defs>
    <linearGradient id="aw-badge-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13202f" />
      <stop offset=".55" stop-color="#0c1521" />
      <stop offset="1" stop-color="#070d15" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#aw-badge-plate)" />
  <rect x="3" y="3" width="506" height="506" rx="101" fill="none" stroke="#e9eff8" stroke-opacity=".11" stroke-width="3" />
  <path
    fill="#edf2f8"
    fill-rule="evenodd"
    d="M232 104H280L364 408H322L294 320H218L190 408H148ZM256 176 222 272H290Z"
  />
</svg>
