<!doctype html>
<html lang="zh-CN" data-phase="prepare" data-leaving="false">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentWorkShop · 初始化</title>
  <style>
    :root {
      --bg: #070c14;
      --top: #0b1322;
      --line: #1d2a3d;
      --line-strong: #2c405b;
      --ink: #e9eff8;
      --soft: #b6c3d5;
      --faint: #93a3b8;
      --dim: #6f8199;
      --mint: #3fe4ab;
      --mint-deep: #2fd79e;
      --danger: #ff8b8b;
      --panel: #0a1220;
      --mono: ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
      --gutter: clamp(16px, 5.5vw, 36px);
      /* Local copies of the app's motion tokens keep this page offline. */
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);
      --transition-base: 200ms var(--ease-out-quart);
      --transition-slow: 240ms var(--ease-out-quart);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family: 'Geist', 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'Noto Sans SC', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--top), var(--bg) 62%);
    }

    .head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 var(--gutter);
      background: radial-gradient(280px 88px at 12% 0, rgb(63 228 171 / 6%), transparent 84%);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      app-region: drag;
    }

    .head::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: 64px;
      height: 1px;
      content: '';
      background: var(--mint);
    }

    .mark {
      flex: none;
      width: 28px;
      height: 28px;
    }

    .wordmark {
      font-size: 13px;
      line-height: 1;
      letter-spacing: .015em;
      white-space: nowrap;
    }

    .wordmark .agent {
      font-weight: 500;
      color: var(--soft);
    }

    .wordmark .shop {
      font-weight: 650;
      color: var(--ink);
    }

    .version {
      min-width: 0;
      margin-left: auto;
      padding: 3px 8px;
      overflow: hidden;
      font: 10px/1.4 var(--mono);
      color: var(--faint);
      white-space: nowrap;
      text-overflow: ellipsis;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .version:empty { display: none; }

    .content {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(60px, 1fr);
      gap: 18px;
      min-width: 0;
      margin: 24px var(--gutter) 16px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--mint);
      letter-spacing: .1em;
    }

    .phase-dot {
      position: relative;
      flex: none;
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
    }

    .phase-dot::after {
      position: absolute;
      inset: -3px;
      content: '';
      background: rgb(63 228 171 / 14%);
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: -.015em;
      text-wrap: pretty;
    }

    .detail {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--faint);
      text-wrap: pretty;
    }

    .progress {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 4ch;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      font: 12px/1.4 var(--mono);
      color: var(--mint);
      text-align: right;
    }

    .meter {
      height: 8px;
      overflow: hidden;
      background: #111c2c;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .meter-fill {
      display: block;
      height: 100%;
      background: var(--mint-deep);
      transform: scaleX(.1);
      transform-origin: left center;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--dim);
    }

    .steps li:not(:last-child)::before {
      position: absolute;
      top: 4px;
      right: 5px;
      left: 14px;
      height: 1px;
      content: '';
      background: var(--line);
    }

    .steps li.done::before { background: rgb(63 228 171 / 30%); }

    .tick {
      width: 9px;
      height: 9px;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: 50%;
    }

    .steps li.done .tick {
      background: var(--mint);
      border-color: var(--mint);
    }

    .steps li.active .tick {
      background: var(--mint);
      border-color: var(--bg);
      outline: 1px solid var(--mint);
      outline-offset: 1px;
    }

    .steps li.done { color: var(--soft); }

    .steps li.active {
      font-weight: 600;
      color: var(--ink);
    }

    .trace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .trace-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--faint);
      border-bottom: 1px solid var(--line);
    }

    #elapsed { font-family: var(--mono); }

    .lines {
      margin-top: 6px;
      overflow: auto;
      font: 11px/1.55 var(--mono);
      scrollbar-width: thin;
    }

    .line {
      display: flex;
      gap: 10px;
      color: var(--faint);
      white-space: nowrap;
    }

    .line .at {
      flex: none;
      color: var(--dim);
    }

    .line span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line:last-child { color: var(--ink); }

    .foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      min-height: 40px;
      padding: 6px var(--gutter);
      font-size: 11px;
      line-height: 1.4;
      color: var(--faint);
      border-top: 1px solid var(--line);
    }

    .foot-dot {
      flex: none;
      width: 5px;
      height: 5px;
      background: var(--mint);
      border-radius: 50%;
    }

    .foot-path {
      margin-left: auto;
      font-family: var(--mono);
      color: var(--dim);
    }

    .failure {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      padding: clamp(14px, 4vw, 26px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid #3a2230;
      border-radius: 12px;
    }

    .failure-title {
      flex: none;
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      line-height: 1.2;
      color: var(--danger);
    }

    .failure-text {
      max-height: 88px;
      margin: 8px 0 0;
      overflow: auto;
      font-size: 12px;
      line-height: 1.6;
      color: var(--soft);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      -webkit-user-select: text;
      user-select: text;
    }

    .actions {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      min-height: 34px;
      padding: 0 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--soft);
      cursor: pointer;
      background: #101a28;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
    }

    .btn.primary {
      color: var(--bg);
      background: var(--mint);
      border-color: transparent;
    }

    .btn.ghost { background: transparent; }

    .btn:hover { border-color: var(--mint); }
    .btn.primary:hover { background: #63ebbc; }

    .btn:focus-visible {
      outline: 2px solid #6fb3ff;
      outline-offset: 2px;
    }

    html[data-phase='error'] .eyebrow { color: var(--danger); }
    html[data-phase='error'] .foot-dot { background: var(--danger); }

    @media (max-height: 420px) {
      .head { min-height: 44px; }
      .foot { min-height: 32px; }
      .content { gap: 10px; margin-block: 10px 8px; }
      .eyebrow { margin-bottom: 4px; }
      h1 { font-size: clamp(22px, 5vw, 27px); }
      .detail { margin-top: 4px; }
      .progress,
      .steps { margin-top: 8px; }
      .trace { padding-block: 7px; }
      .trace-head { padding-bottom: 4px; }
      .lines { max-height: 3.1em; margin-top: 4px; }
      .failure { padding-block: 14px; }
    }

    @media (max-height: 330px) {
      .lines { max-height: 1.55em; }
    }

    /* Reduced motion gets the same progress and ready state without any animation. */
    @media (prefers-reduced-motion: no-preference) {
      .frame { transition: opacity var(--transition-slow); }
      html[data-leaving='true'] .frame { opacity: 0; }
      .meter-fill { transition: transform var(--transition-base); }

      html:not([data-phase='ready'], [data-phase='error']) .phase-dot::after {
        animation: phase-pulse 1.7s ease-in-out infinite;
      }
    }

    @keyframes phase-pulse {
      50% { opacity: .35; }
    }
  </style>
</head>
<body>
  <main class="frame" id="frame">
    <header class="head">
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#142339" />
            <stop offset=".58" stop-color="#0b1422" />
            <stop offset="1" stop-color="#070c14" />
          </linearGradient>
          <linearGradient id="mint" x1="15" y1="51" x2="49" y2="11" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2fd79e" />
            <stop offset="1" stop-color="#63ebbc" />
          </linearGradient>
          <linearGradient id="cyan" x1="23" y1="37" x2="41" y2="37" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2bb9e8" />
            <stop offset="1" stop-color="#7ce0ff" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="120" fill="url(#badge)" />
        <rect x="2.5" y="2.5" width="507" height="507" rx="118" fill="none" stroke="#3fe4ab" stroke-opacity=".2" stroke-width="3" />
        <g transform="translate(256 256) scale(8.2) translate(-32 -31.5)" fill="none" stroke-linecap="round">
          <path d="M32 12 15.5 51" stroke="url(#mint)" stroke-width="6.4" />
          <path d="M32 12 48.5 51" stroke="url(#mint)" stroke-width="6.4" />
          <path d="M23.4 37h17.2" stroke="url(#cyan)" stroke-width="5.2" />
        </g>
      </svg>
      <div class="wordmark"><span class="agent">Agent</span><span class="shop">WorkShop</span></div>
      <span class="version" id="version"></span>
    </header>

    <div class="content">
      <section class="stage">
        <p class="eyebrow"><span class="phase-dot" aria-hidden="true"></span><span id="phase-label">正在初始化</span></p>
        <h1 id="title" role="status" aria-live="polite">准备运行环境</h1>
        <p class="detail" id="detail" aria-live="polite">校验安装载荷与用户数据目录</p>
        <div class="progress">
          <div class="meter" id="meter" role="progressbar" aria-label="初始化进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
            <span class="meter-fill" id="fill"></span>
          </div>
          <span id="percent" aria-hidden="true">10%</span>
        </div>
        <ol class="steps" id="steps">
          <li data-step="prepare"><span class="tick" aria-hidden="true"></span><span>环境</span></li>
          <li data-step="data"><span class="tick" aria-hidden="true"></span><span>数据</span></li>
          <li data-step="service"><span class="tick" aria-hidden="true"></span><span>服务</span></li>
          <li data-step="workshop"><span class="tick" aria-hidden="true"></span><span>工作台</span></li>
        </ol>
      </section>

      <section class="trace" aria-label="启动记录">
        <div class="trace-head"><span>启动记录</span><span id="elapsed">0.0s</span></div>
        <div class="lines" id="lines"></div>
      </section>

      <section class="failure" id="failure" role="alert" hidden>
        <p class="failure-title">启动失败</p>
        <p class="failure-text" id="failure-text"></p>
        <div class="actions">
          <button type="button" class="btn primary" data-action="retry">重试</button>
          <button type="button" class="btn" data-action="open-logs">打开日志</button>
          <button type="button" class="btn ghost" data-action="quit">退出</button>
        </div>
      </section>
    </div>

    <footer class="foot">
      <span class="foot-dot" aria-hidden="true"></span>
      <span id="foot-text">服务就绪后自动进入工作台</span>
      <span class="foot-path">本机服务 · 127.0.0.1</span>
    </footer>
  </main>

  <script>
    (() => {
      const api = window.awSplash
      const root = document.documentElement
      const byId = id => document.getElementById(id)
      const elements = {
        title: byId('title'),
        detail: byId('detail'),
        phase: byId('phase-label'),
        fill: byId('fill'),
        meter: byId('meter'),
        percent: byId('percent'),
        steps: byId('steps'),
        lines: byId('lines'),
        elapsed: byId('elapsed'),
        version: byId('version'),
        failure: byId('failure'),
        failureText: byId('failure-text'),
        foot: byId('foot-text'),
      }
      const phaseText = {
        prepare: '正在初始化',
        data: '正在初始化',
        service: '正在启动服务',
        workshop: '正在装配工作台',
        ready: '已就绪',
        error: '启动中断',
      }
      const order = ['prepare', 'data', 'service', 'workshop']
      let startedAt = Date.now()

      const elapsedText = (ms) => {
        const seconds = Math.max(0, ms) / 1000
        return seconds < 60 ? `${seconds.toFixed(1)}s` : `${Math.floor(seconds / 60)}m ${(seconds % 60).toFixed(0)}s`
      }
      const traceAt = (ms) => `+${(Math.max(0, ms) / 1000).toFixed(2).padStart(5, '0')}`

      function render(state) {
        if (!state) return
        startedAt = Number(state.startedAt) || startedAt
        root.dataset.phase = state.phase || 'prepare'
        root.dataset.leaving = state.leaving ? 'true' : 'false'
        elements.title.textContent = state.title || ''
        elements.detail.textContent = state.detail || ''
        elements.phase.textContent = phaseText[state.phase] || '正在初始化'
        const progress = Math.max(0, Math.min(100, Number(state.progress) || 0))
        const roundedProgress = Math.round(progress)
        elements.fill.style.transform = `scaleX(${progress / 100})`
        elements.percent.textContent = `${roundedProgress}%`
        elements.meter.setAttribute('aria-valuenow', String(roundedProgress))
        elements.meter.setAttribute('aria-label', state.title || '初始化进度')
        const index = order.indexOf(state.phase)
        for (const item of elements.steps.querySelectorAll('[data-step]')) {
          const at = order.indexOf(item.dataset.step)
          item.classList.toggle('done', state.phase === 'ready' || (index >= 0 && at < index))
          item.classList.toggle('active', at === index)
        }
        const trace = Array.isArray(state.trace) ? state.trace.slice(-4) : []
        elements.lines.replaceChildren(...trace.map((entry) => {
          const line = document.createElement('div')
          line.className = 'line'
          const at = document.createElement('span')
          at.className = 'at'
          at.textContent = traceAt(entry.at)
          const text = document.createElement('span')
          text.textContent = String(entry.text || '')
          line.append(at, text)
          return line
        }))
        elements.version.textContent = state.version ? `v${state.version}` : ''
        const failed = state.phase === 'error'
        elements.failure.hidden = !failed
        if (failed) {
          elements.failureText.textContent = `${state.error || '本机服务未能启动。'}\n日志：${state.logPath || ''}`
          elements.phase.textContent = phaseText.error
        }
        elements.foot.textContent = failed
          ? '可以重试，或打开日志查看原因'
          : state.phase === 'ready' ? '工作台已就绪，正在进入' : '服务就绪后自动进入工作台'
        elements.lines.scrollTop = elements.lines.scrollHeight
      }

      setInterval(() => { elements.elapsed.textContent = elapsedText(Date.now() - startedAt) }, 100)
      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => api?.action(button.dataset.action))
      })
      if (api) {
        api.onState(render)
        api.hello()
      }
      else {
        root.dataset.ready = 'missing'
      }
    })()
  </script>
</body>
</html>
