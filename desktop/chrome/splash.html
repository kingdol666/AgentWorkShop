<!doctype html>
<html lang="zh-CN" data-phase="prepare" data-leaving="false" data-drawn="true">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentWorkShop · 初始化</title>
  <style>
    /* ─────────────────────────────────────────────────────────────
     * 启动序列:仪器通电,而不是加载条。
     * 一次性的启动动作(扫描线 / 描字 / 信号头)全部有终点;
     * 等待期间不靠无限动效提示,进度只跟随真实阶段。
     * 配色与标题栏同源(深海军蓝底 + 信号绿),字体全部系统栈(离线)。
     * ───────────────────────────────────────────────────────────── */
    :root {
      --bg: #070c14;
      --top: #0b1322;
      --line: #1d2a3d;
      --line-strong: #2c405b;
      --ink: #e9eff8;
      --soft: #b6c3d5;
      --faint: #93a3b8;
      --dim: #6f8199;
      --mint: #3fe4ab;
      --mint-deep: #2fd79e;
      --danger: #ff8b8b;
      --panel: #0a1220;
      --mono: ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
      --gutter: clamp(16px, 5.5vw, 32px);
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);
      --transition-fast: 160ms var(--ease-out-quart);
      --transition-base: 240ms var(--ease-out-quart);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family: 'Geist', 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'Noto Sans SC', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(320px 150px at 14% -6%, rgb(63 228 171 / 7%), transparent 78%),
        linear-gradient(180deg, var(--top), var(--bg) 64%);
    }

    /* 底纹:22px 点阵只在上半部可见,给深底一点仪器面板的质感,不抢内容。 */
    .frame::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: '';
      background-image: radial-gradient(circle, rgb(233 239 248 / 4.5%) 1px, transparent 1px);
      background-size: 22px 22px;
      -webkit-mask-image: linear-gradient(180deg, #000 0, rgb(0 0 0 / 55%) 46%, transparent 82%);
      mask-image: linear-gradient(180deg, #000 0, rgb(0 0 0 / 55%) 46%, transparent 82%);
    }

    /* 启动扫描:一次性竖向光带越过整屏,表示"系统通电",结束后不出现。 */
    .scan {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: -2px;
      width: 2px;
      pointer-events: none;
      content: '';
      background: linear-gradient(180deg, transparent, rgb(63 228 171 / 55%), transparent);
      opacity: 0;
    }

    .head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 0 var(--gutter);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      app-region: drag;
    }

    /* 仪器刻线:品牌标志起笔的一小段信号绿,接一条发丝线贯穿页头。 */
    .head::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: 56px;
      height: 1px;
      content: '';
      background: var(--mint);
    }

    .mark {
      flex: none;
      width: 13px;
      height: 18px;
      color: var(--ink);
    }

    .wordmark {
      font-size: 12.5px;
      line-height: 1;
      letter-spacing: .015em;
      white-space: nowrap;
    }

    .wordmark .agent {
      font-weight: 500;
      color: var(--soft);
    }

    .wordmark .shop {
      font-weight: 650;
      color: var(--ink);
    }

    .version {
      min-width: 0;
      margin-left: auto;
      padding: 3px 8px;
      overflow: hidden;
      font: 10px/1.4 var(--mono);
      color: var(--faint);
      white-space: nowrap;
      text-overflow: ellipsis;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .version:empty { display: none; }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 16px;
      min-width: 0;
      margin: 18px var(--gutter) 10px;
    }

    /* 启动主体垂直居中,启动记录贴住底部——上半部承重,下半部留白。 */
    .stage {
      display: flex;
      flex-direction: column;
      gap: 18px;
      justify-content: center;
      min-width: 0;
    }

    .hero {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .glyph {
      display: block;
      width: 72px;
      height: 96px;
      color: var(--ink);
    }

    .glyph-trace {
      opacity: 1;
      stroke: var(--mint);
    }

    .glyph-fill { opacity: 1; }

    /* 描字阶段:先只看得见绿色轮廓,起笔完成后实心字才落下来。 */
    html[data-drawn='false'] .glyph-fill { opacity: 0; }

    html[data-drawn='true'] .glyph-trace {
      opacity: 0;
      transition: opacity 200ms var(--ease-out-quart) 120ms;
    }

    /* 就绪时沿字再描一遍(460ms),是"复检"动作,不改变字形本身。 */
    .glyph.retrace .glyph-trace {
      opacity: 1;
      transition: none;
    }

    .copy { min-width: 0; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 7px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--mint);
      letter-spacing: .1em;
    }

    .lamp {
      position: relative;
      flex: none;
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
    }

    .lamp::after {
      position: absolute;
      inset: -3px;
      content: '';
      background: rgb(63 228 171 / 13%);
      border-radius: 50%;
    }

    .stage-no {
      margin-left: auto;
      font: 500 10px/1 var(--mono);
      color: var(--dim);
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 4.6vw, 31px);
      font-weight: 650;
      line-height: 1.16;
      letter-spacing: -.015em;
      text-wrap: pretty;
    }

    .detail {
      margin: 7px 0 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--faint);
      text-wrap: pretty;
    }

    /* 阶段切换时文字只做一次 220ms 的落位,不做循环闪烁。 */
    .copy.flash { animation: copy-in 220ms var(--ease-out-quart); }

    @keyframes copy-in {
      from { opacity: .25; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    .railwrap { min-width: 0; }

    .rail-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font: 10px/1.3 var(--mono);
      color: var(--dim);
      letter-spacing: .1em;
    }

    .rail-meta .pct {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--mint);
      letter-spacing: .02em;
    }

    .railbox {
      position: relative;
      height: 38px;
    }

    .rail {
      position: absolute;
      top: 5px;
      right: 0;
      left: 0;
      height: 3px;
    }

    .track {
      position: absolute;
      inset: 1px 0 auto;
      height: 1px;
      background: var(--line-strong);
    }

    .fill {
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 3px;
      background: var(--mint-deep);
      border-radius: 2px;
      transform: scaleX(.1);
      transform-origin: left center;
      transition: transform var(--transition-base);
    }

    /* 信号头:只在进度推进时亮起 320ms,停稳后消失——它是"运动",不是"等待"。 */
    .rail-head {
      position: absolute;
      top: 1.5px;
      left: 10%;
      width: 12px;
      height: 12px;
      pointer-events: none;
      background: radial-gradient(circle, rgb(63 228 171 / 55%), transparent 68%);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: left var(--transition-base), opacity 320ms var(--ease-out-quart);
    }

    .rail.moving .rail-head { opacity: 1; }

    .stations {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stations li {
      position: absolute;
      top: 0;
      left: var(--at);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
    }

    .pip {
      width: 7px;
      height: 7px;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      transform: rotate(45deg);
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .stations li span {
      font-size: 10.5px;
      line-height: 1;
      color: var(--dim);
      white-space: nowrap;
      transition: color var(--transition-fast);
    }

    .stations li.done .pip {
      background: var(--mint-deep);
      border-color: var(--mint-deep);
    }

    .stations li.done span { color: var(--faint); }

    .stations li.active .pip {
      background: var(--mint);
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgb(63 228 171 / 16%);
    }

    .stations li.active span {
      font-weight: 600;
      color: var(--ink);
    }

    /* 每次到达站点,菱形只扩一次环(520ms),不做常驻脉冲。 */
    .stations li.ping .pip { animation: pip-ping 520ms var(--ease-out-quart); }

    @keyframes pip-ping {
      from { box-shadow: 0 0 0 0 rgb(63 228 171 / 42%); }
      to { box-shadow: 0 0 0 9px rgb(63 228 171 / 0%); }
    }

    .trace {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      padding-top: 4px;
    }

    .trace-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font: 10px/1.4 var(--mono);
      color: var(--dim);
      letter-spacing: .12em;
    }

    #elapsed {
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }

    .lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      font: 10.5px/1.5 var(--mono);
    }

    .line {
      display: flex;
      gap: 10px;
      color: var(--dim);
      white-space: nowrap;
      animation: line-in 180ms var(--ease-out-quart);
    }

    .line .at {
      flex: none;
      color: var(--line-strong);
      font-variant-numeric: tabular-nums;
    }

    .line span:last-child {
      overflow: hidden;
      color: var(--faint);
      text-overflow: ellipsis;
    }

    .line:last-child span:last-child { color: var(--soft); }

    @keyframes line-in {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }

    .foot {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      min-height: 34px;
      padding: 5px var(--gutter);
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--faint);
      border-top: 1px solid var(--line);
    }

    .foot-dot {
      flex: none;
      width: 5px;
      height: 5px;
      background: var(--mint);
      border-radius: 50%;
    }

    .foot-path {
      margin-left: auto;
      font-family: var(--mono);
      color: var(--dim);
    }

    .failure {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      padding: clamp(14px, 4vw, 26px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid #3a2230;
      border-radius: 12px;
    }

    .failure-title {
      flex: none;
      margin: 0;
      font-size: 21px;
      font-weight: 650;
      line-height: 1.2;
      color: var(--danger);
    }

    .failure-text {
      max-height: 88px;
      margin: 8px 0 0;
      overflow: auto;
      font-size: 12px;
      line-height: 1.6;
      color: var(--soft);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      -webkit-user-select: text;
      user-select: text;
    }

    .actions {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      min-height: 34px;
      padding: 0 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--soft);
      cursor: pointer;
      background: #101a28;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
    }

    .btn.primary {
      color: var(--bg);
      background: var(--mint);
      border-color: transparent;
    }

    .btn.ghost { background: transparent; }

    .btn:hover { border-color: var(--mint); }
    .btn.primary:hover { background: #63ebbc; }

    .btn:focus-visible {
      outline: 2px solid #6fb3ff;
      outline-offset: 2px;
    }

    html[data-phase='error'] .eyebrow { color: var(--danger); }
    html[data-phase='error'] .foot-dot { background: var(--danger); }
    html[data-phase='error'] .fill { background: var(--danger); }
    html[data-phase='ready'] .lamp::after { background: rgb(63 228 171 / 22%); }

    @media (max-height: 420px) {
      .head { min-height: 42px; }
      .foot { min-height: 30px; }
      .content { gap: 12px; margin-block: 12px 8px; }
      .hero { grid-template-columns: 56px minmax(0, 1fr); gap: 14px; }
      .glyph { width: 56px; height: 76px; }
      h1 { font-size: clamp(20px, 4.6vw, 25px); }
      .detail { margin-top: 4px; }
      .railbox { height: 34px; }
    }

    /* 减少动态效果:同样的真实进度与就绪状态,但不描字、不扫描、不做位移动画。 */
    @media (prefers-reduced-motion: reduce) {
      .fill,
      .rail-head,
      .pip,
      .stations li span { transition: none; }

      .copy.flash,
      .stations li.ping .pip,
      .line { animation: none; }

      .scan { display: none; }

      .glyph-trace { display: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .frame { transition: opacity var(--transition-base); }
      html[data-leaving='true'] .frame { opacity: 0; }
      /* 页面加载时的一次性扫描;动画自带 both 填充,不会循环。 */
      .scan { animation: scan-sweep 1.1s var(--ease-out-quart) 120ms both; }
      html[data-phase='ready'] .rail-head { opacity: 0; }
    }

    @keyframes scan-sweep {
      0% { opacity: 0; transform: translateX(0); }
      10% { opacity: .75; }
      100% { opacity: 0; transform: translateX(660px); }
    }
  </style>
</head>
<body>
  <main class="frame" id="frame">
    <span class="scan" id="scan" aria-hidden="true"></span>

    <header class="head">
      <svg class="mark" viewBox="148 104 216 304" aria-hidden="true">
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M232 104H280L364 408H322L294 320H218L190 408H148ZM256 176 222 272H290Z"
        />
      </svg>
      <div class="wordmark"><span class="agent">Agent</span><span class="shop">WorkShop</span></div>
      <span class="version" id="version"></span>
    </header>

    <div class="content">
      <div class="stage">
        <section class="hero">
          <svg class="glyph" id="glyph" viewBox="148 104 216 304" aria-hidden="true">
            <path
              class="glyph-fill"
              fill="currentColor"
              fill-rule="evenodd"
              d="M232 104H280L364 408H322L294 320H218L190 408H148ZM256 176 222 272H290Z"
            />
            <path
              class="glyph-trace"
              fill="none"
              stroke-width="5"
              stroke-linejoin="round"
              stroke-linecap="round"
              d="M232 104H280L364 408H322L294 320H218L190 408H148ZM256 176 222 272H290Z"
            />
          </svg>

          <div class="copy" id="copy">
            <p class="eyebrow">
              <span class="lamp" aria-hidden="true"></span>
              <span id="phase-label">正在初始化</span>
              <span class="stage-no" id="stage-no">STAGE 01 / 04</span>
            </p>
            <h1 id="title" role="status" aria-live="polite">准备运行环境</h1>
            <p class="detail" id="detail" aria-live="polite">校验安装载荷与用户数据目录</p>
          </div>
        </section>

        <div class="railwrap">
          <div class="rail-meta">
            <span id="rail-label">本机服务启动序列</span>
            <span class="pct" id="percent" aria-hidden="true">10%</span>
          </div>
          <div class="railbox">
            <div class="rail" id="rail" role="progressbar" aria-label="初始化进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
              <span class="track" aria-hidden="true"></span>
              <span class="fill" id="fill" aria-hidden="true"></span>
              <span class="rail-head" id="rail-head" aria-hidden="true"></span>
            </div>
            <ol class="stations" id="stations" aria-hidden="true">
              <li data-step="prepare" style="--at:10%"><i class="pip"></i><span>环境</span></li>
              <li data-step="data" style="--at:28%"><i class="pip"></i><span>数据</span></li>
              <li data-step="service" style="--at:52%"><i class="pip"></i><span>服务</span></li>
              <li data-step="workshop" style="--at:78%"><i class="pip"></i><span>工作台</span></li>
            </ol>
          </div>
        </div>
      </div>

      <section class="trace" aria-label="启动记录">
        <div class="trace-head"><span>启动记录</span><span id="elapsed">0.0s</span></div>
        <div class="lines" id="lines"></div>
      </section>

      <section class="failure" id="failure" role="alert" hidden>
        <p class="failure-title">启动失败</p>
        <p class="failure-text" id="failure-text"></p>
        <div class="actions">
          <button type="button" class="btn primary" data-action="retry">重试</button>
          <button type="button" class="btn" data-action="open-logs">打开日志</button>
          <button type="button" class="btn ghost" data-action="quit">退出</button>
        </div>
      </section>
    </div>

    <footer class="foot">
      <span class="foot-dot" aria-hidden="true"></span>
      <span id="foot-text">服务就绪后自动进入工作台</span>
      <span class="foot-path">本机服务 · 127.0.0.1</span>
    </footer>
  </main>

  <script>
    (() => {
      const api = window.awSplash
      const root = document.documentElement
      const byId = id => document.getElementById(id)
      const elements = {
        glyph: byId('glyph'),
        copy: byId('copy'),
        title: byId('title'),
        detail: byId('detail'),
        phase: byId('phase-label'),
        stageNo: byId('stage-no'),
        fill: byId('fill'),
        head: byId('rail-head'),
        rail: byId('rail'),
        percent: byId('percent'),
        stations: byId('stations'),
        lines: byId('lines'),
        elapsed: byId('elapsed'),
        version: byId('version'),
        failure: byId('failure'),
        failureText: byId('failure-text'),
        foot: byId('foot-text'),
      }
      const phaseText = {
        prepare: '正在初始化',
        data: '正在初始化',
        service: '正在启动服务',
        workshop: '正在装配工作台',
        ready: '已就绪',
        error: '启动中断',
      }
      const order = ['prepare', 'data', 'service', 'workshop']
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      let startedAt = Date.now()
      let shownPhase = null
      let flashTimer

      const elapsedText = (ms) => {
        const seconds = Math.max(0, ms) / 1000
        return seconds < 60 ? `${seconds.toFixed(1)}s` : `${Math.floor(seconds / 60)}m ${(seconds % 60).toFixed(0)}s`
      }
      const traceAt = (ms) => `+${(Math.max(0, ms) / 1000).toFixed(2).padStart(5, '0')}`

      // 描字:绿色细线按总长度走一遍,落笔后实心字接上。只播一次,失败或省电模式直接看结果。
      function drawMark() {
        const trace = document.querySelector('.glyph-trace')
        if (!trace || reduced) {
          root.dataset.drawn = 'true'
          return
        }
        root.dataset.drawn = 'false'
        const length = trace.getTotalLength()
        trace.style.strokeDasharray = String(length)
        trace.style.strokeDashoffset = String(length)
        const stroke = trace.animate(
          [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
          { duration: 760, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' },
        )
        stroke.addEventListener('finish', () => { root.dataset.drawn = 'true' })
      }

      // 装配阶段复检:沿同一字形再描一遍(420ms),在进入主界面前把信号收束,不留常驻动效。
      function retraceMark() {
        const trace = document.querySelector('.glyph-trace')
        const glyph = elements.glyph
        if (!trace || !glyph || reduced || glyph.classList.contains('retrace')) return
        glyph.classList.add('retrace')
        const length = trace.getTotalLength()
        trace.style.strokeDasharray = String(length)
        trace.style.strokeDashoffset = String(length)
        const stroke = trace.animate(
          [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
          { duration: 420, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
        )
        stroke.addEventListener('finish', () => {
          trace.style.strokeDashoffset = '0'
          glyph.classList.remove('retrace')
        })
      }

      // 站点到达:菱形扩一次环,信号头亮 320ms 后熄灭。
      function pulseStation(item) {
        if (!item || reduced) return
        item.classList.remove('ping')
        void item.offsetWidth
        item.classList.add('ping')
        elements.rail.classList.add('moving')
        clearTimeout(pulseStation.timer)
        pulseStation.timer = setTimeout(() => elements.rail.classList.remove('moving'), 340)
      }

      function render(state) {
        if (!state) return
        startedAt = Number(state.startedAt) || startedAt
        root.dataset.phase = state.phase || 'prepare'
        root.dataset.leaving = state.leaving ? 'true' : 'false'
        const changed = shownPhase !== null && shownPhase !== state.phase
        shownPhase = state.phase
        elements.title.textContent = state.title || ''
        elements.detail.textContent = state.detail || ''
        elements.phase.textContent = phaseText[state.phase] || '正在初始化'
        const progress = Math.max(0, Math.min(100, Number(state.progress) || 0))
        const roundedProgress = Math.round(progress)
        elements.fill.style.transform = `scaleX(${progress / 100})`
        elements.head.style.left = `${progress}%`
        elements.percent.textContent = `${roundedProgress}%`
        elements.rail.setAttribute('aria-valuenow', String(roundedProgress))
        elements.rail.setAttribute('aria-valuetext', state.title || '初始化进度')
        elements.rail.setAttribute('aria-label', state.title || '初始化进度')
        const index = order.indexOf(state.phase)
        const stage = state.phase === 'ready' ? 4 : index + 1
        elements.stageNo.textContent = state.phase === 'ready'
          ? 'STAGE 04 / 04'
          : state.phase === 'error'
            ? 'STAGE -- / 04'
            : `STAGE 0${Math.max(1, stage)} / 04`
        let activeItem = null
        for (const item of elements.stations.querySelectorAll('[data-step]')) {
          const at = order.indexOf(item.dataset.step)
          const done = state.phase === 'ready' || (index >= 0 && at < index)
          const active = at === index
          item.classList.toggle('done', done)
          item.classList.toggle('active', active)
          if (active) activeItem = item
        }
        if (changed) {
          pulseStation(activeItem)
          clearTimeout(flashTimer)
          elements.copy.classList.remove('flash')
          void elements.copy.offsetWidth
          elements.copy.classList.add('flash')
          flashTimer = setTimeout(() => elements.copy.classList.remove('flash'), 260)
          if (state.phase === 'workshop') retraceMark()
        }
        const trace = Array.isArray(state.trace) ? state.trace.slice(-3) : []
        elements.lines.replaceChildren(...trace.map((entry) => {
          const line = document.createElement('div')
          line.className = 'line'
          const at = document.createElement('span')
          at.className = 'at'
          at.textContent = traceAt(entry.at)
          const text = document.createElement('span')
          text.textContent = String(entry.text || '')
          line.append(at, text)
          return line
        }))
        elements.version.textContent = state.version ? `v${state.version}` : ''
        const failed = state.phase === 'error'
        elements.failure.hidden = !failed
        if (failed) {
          elements.failureText.textContent = `${state.error || '本机服务未能启动。'}\n日志：${state.logPath || ''}`
          elements.phase.textContent = phaseText.error
        }
        elements.foot.textContent = failed
          ? '可以重试，或打开日志查看原因'
          : state.phase === 'ready' ? '工作台已就绪，正在进入' : '服务就绪后自动进入工作台'
      }

      drawMark()
      setInterval(() => { elements.elapsed.textContent = elapsedText(Date.now() - startedAt) }, 100)
      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => api?.action(button.dataset.action))
      })
      if (api) {
        api.onState(render)
        api.hello()
      }
      else {
        root.dataset.ready = 'missing'
      }
    })()
  </script>
</body>
</html>
