<!doctype html>
<html lang="zh-CN" data-theme="dark" data-status="idle">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentWorkShop · 更新中心</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070c14;
      --top: #0b1322;
      --panel: #0d1726;
      --panel-strong: #111e30;
      --line: #1d2a3d;
      --line-strong: #2c405b;
      --ink: #e9eff8;
      --soft: #b6c3d5;
      --faint: #93a3b8;
      --dim: #6f8199;
      --accent: #3fe4ab;
      --accent-deep: #2fd79e;
      --warning: #f6c453;
      --danger: #ff8b8b;
      --focus: #6fb3ff;
      --mono: ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
    }

    html[data-theme='light'] {
      color-scheme: light;
      --bg: #f6f5f2;
      --top: #ffffff;
      --panel: #ffffff;
      --panel-strong: #f0efeb;
      --line: #e4e1dc;
      --line-strong: #d6d2cc;
      --ink: #0c0a09;
      --soft: #57534e;
      --faint: #6b665d;
      --dim: #8a837a;
      --accent: #1f8f66;
      --accent-deep: #167451;
      --warning: #a16800;
      --danger: #b4232b;
      --focus: #2563eb;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html,
    body { min-width: 520px; min-height: 100%; margin: 0; background: var(--bg); }

    body {
      color: var(--ink);
      font-family: 'Geist', 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'Noto Sans SC', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    button,
    select,
    input { font: inherit; }

    button,
    select,
    input[type='checkbox'] { -webkit-app-region: no-drag; app-region: no-drag; }

    button {
      min-height: 34px;
      padding: 0 13px;
      color: var(--soft);
      cursor: pointer;
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) {
      color: var(--ink);
      background: color-mix(in srgb, var(--accent) 12%, var(--panel-strong));
      border-color: color-mix(in srgb, var(--accent) 46%, var(--line-strong));
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    button:disabled,
    select:disabled,
    input:disabled { cursor: not-allowed; opacity: .48; }

    button.primary {
      color: #07120d;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 650;
    }

    button.primary:hover:not(:disabled) {
      color: #07120d;
      background: var(--accent-deep);
      border-color: var(--accent-deep);
    }

    .shell {
      min-height: 100vh;
      background:
        radial-gradient(480px 220px at 10% -4%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 75%),
        linear-gradient(180deg, var(--top), var(--bg) 60%);
    }

    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      app-region: drag;
    }

    .head::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 64px;
      height: 1px;
      content: '';
      background: var(--accent);
    }

    .mark { flex: none; width: 14px; height: 20px; color: var(--ink); }
    .wordmark { font-size: 13px; letter-spacing: .015em; white-space: nowrap; }
    .wordmark .agent { color: var(--soft); font-weight: 500; }
    .wordmark .shop { color: var(--ink); font-weight: 650; }
    .head-separator { width: 1px; height: 16px; background: var(--line-strong); }
    .head-title { color: var(--faint); font-size: 12px; }
    .head-version { margin-left: auto; color: var(--dim); font: 10px/1.4 var(--mono); }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      width: min(980px, calc(100% - 56px));
      margin: 26px auto 30px;
    }

    .main-column,
    .side-column { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .card {
      padding: 21px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 11px;
      box-shadow: 0 18px 50px rgb(0 0 0 / 8%);
    }

    .status-card { min-height: 258px; }

    .status-head,
    .card-heading,
    .progress-meta,
    .probe-row,
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .lamp {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 14%, transparent);
    }

    .status-badge {
      flex: none;
      padding: 4px 8px;
      color: var(--faint);
      font: 10px/1.2 var(--mono);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
    }

    h1,
    h2,
    p { margin: 0; }

    h1 { font-size: clamp(23px, 4vw, 32px); font-weight: 650; letter-spacing: -.018em; line-height: 1.15; }
    h2 { font-size: 13px; font-weight: 650; }
    .detail { max-width: 600px; margin-top: 8px; color: var(--faint); font-size: 13px; line-height: 1.55; }

    .status-card[data-status='error'] .lamp { color: var(--danger); }
    .status-card[data-status='checking'] .lamp,
    .status-card[data-status='downloading'] .lamp,
    .status-card[data-status='verifying'] .lamp,
    .status-card[data-status='installing'] .lamp { color: var(--warning); }
    .status-card[data-status='available'] .lamp,
    .status-card[data-status='ready'] .lamp { color: var(--accent); }

    .progress-wrap { margin-top: 25px; }
    .progress-meta { margin-bottom: 7px; color: var(--dim); font: 10px/1.4 var(--mono); }
    .progress-value { color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; }
    .progress-track { height: 5px; overflow: hidden; background: var(--line); border-radius: 4px; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent-deep); border-radius: inherit; transition: width 180ms ease; }
    .progress-detail { min-height: 17px; margin-top: 8px; color: var(--dim); font: 10px/1.4 var(--mono); white-space: pre-wrap; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }

    .notice {
      margin-top: 15px;
      padding: 9px 11px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.45;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border-left: 2px solid var(--accent);
    }

    .notes-card { padding-bottom: 17px; }
    .notes { min-height: 22px; margin-top: 13px; color: var(--faint); font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
    .empty { color: var(--dim); }

    .side-column .card { padding: 17px; }
    .card-heading { margin-bottom: 15px; }
    .card-heading h2 { color: var(--ink); }
    .card-heading small { color: var(--dim); font-size: 10px; }

    .setting-row { min-height: 37px; color: var(--soft); font-size: 12px; }
    .setting-row + .setting-row { border-top: 1px solid var(--line); }
    .setting-label { display: flex; flex-direction: column; gap: 2px; }
    .setting-help { color: var(--dim); font-size: 10px; }

    select,
    input[type='text'],
    input[type='number'] {
      min-width: 112px;
      padding: 6px 8px;
      color: var(--soft);
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
    }

    input[type='text'] { width: 148px; }
    input[type='number'] { width: 86px; }

    .manual-proxy {
      display: grid;
      gap: 8px;
      margin-top: 11px;
      padding: 11px;
      background: color-mix(in srgb, var(--panel-strong) 72%, transparent);
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .manual-proxy-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .manual-proxy-row label { color: var(--faint); font-size: 11px; }
    .manual-proxy-help { color: var(--dim); font-size: 10px; line-height: 1.45; }
    .manual-proxy button { width: 100%; }
    .manual-proxy-error { color: var(--danger); font-size: 12px; line-height: 1.45; }

    input[type='checkbox'] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .probe-status { color: var(--soft); font-size: 12px; }
    .probe-status[data-kind='error'] { color: var(--danger); }
    .probe-status[data-kind='ok'] { color: var(--accent); }
    .probe-meta { margin-top: 6px; color: var(--dim); font: 10px/1.45 var(--mono); white-space: pre-wrap; }
    .probe-button { width: 100%; margin-top: 14px; }

    .footer {
      width: min(980px, calc(100% - 56px));
      margin: 0 auto 22px;
      color: var(--dim);
      font: 10px/1.5 var(--mono);
    }

    @media (max-width: 760px) {
      html, body { min-width: 0; }
      .head { padding: 0 18px; }
      .content,
      .footer { width: calc(100% - 36px); }
      .content { grid-template-columns: 1fr; }
      .head-version { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      button,
      .progress-bar { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="head" role="banner">
      <svg class="mark" viewBox="148 104 216 304" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M232 104H280L364 408H322L294 320H218L190 408H148ZM256 176 222 272H290Z" />
      </svg>
      <span class="wordmark"><span class="agent">Agent</span><span class="shop">WorkShop</span></span>
      <span class="head-separator" aria-hidden="true"></span>
      <span class="head-title">更新中心</span>
      <span class="head-version" id="head-version"></span>
    </header>

    <main class="content" aria-labelledby="page-title">
      <section class="main-column">
        <article class="card status-card" id="status-card" data-status="idle" aria-labelledby="page-title">
          <div class="status-head">
            <p class="eyebrow"><span class="lamp" aria-hidden="true"></span><span id="status-kicker">DESKTOP UPDATE</span></p>
            <span class="status-badge" id="status-badge">空闲</span>
          </div>
          <h1 id="page-title">准备检查更新</h1>
          <p class="detail" id="status-detail">检查 AgentWorkShop 的最新桌面版本。</p>

          <div class="progress-wrap" id="progress-wrap" hidden>
            <div class="progress-meta">
              <span id="progress-label">下载进度</span>
              <span class="progress-value" id="progress-value">0%</span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="更新进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p class="progress-detail" id="progress-detail"></p>
          </div>

          <div class="actions" aria-label="更新操作">
            <button class="primary" id="check-button" type="button" data-action="check">检查更新</button>
            <button class="primary" id="download-button" type="button" data-action="download" hidden>下载更新</button>
            <button id="pause-button" type="button" data-action="pause" hidden>暂停下载</button>
            <button id="cancel-button" type="button" data-action="cancel" hidden>取消</button>
            <button class="primary" id="install-button" type="button" data-action="install" hidden>安装并重启</button>
            <button id="retry-button" type="button" data-action="check" hidden>重试</button>
          </div>
          <p class="notice" id="notice" hidden role="status" aria-live="polite"></p>
        </article>

        <article class="card notes-card" aria-labelledby="notes-title">
          <div class="card-heading">
            <h2 id="notes-title">版本说明</h2>
            <small id="release-version"></small>
          </div>
          <p class="notes empty" id="notes">检查到新版本后，版本说明会显示在这里。</p>
        </article>
      </section>

      <aside class="side-column" aria-label="更新设置与连接诊断">
        <section class="card" aria-labelledby="settings-title">
          <div class="card-heading">
            <h2 id="settings-title">更新设置</h2>
            <small>本机</small>
          </div>
          <div class="setting-row">
            <span class="setting-label"><span>更新通道</span><span class="setting-help">下载使用的网络路径</span></span>
            <select id="proxy-mode" aria-label="更新通道">
              <option value="system">系统代理</option>
              <option value="manual">手动代理</option>
              <option value="direct">直连</option>
            </select>
          </div>
          <div class="manual-proxy" id="manual-proxy-settings" hidden>
            <div class="manual-proxy-row">
              <label for="proxy-protocol">代理协议</label>
              <select id="proxy-protocol">
                <option value="http">HTTP</option>
                <option value="https">HTTPS</option>
                <option value="socks5">SOCKS5</option>
              </select>
            </div>
            <div class="manual-proxy-row">
              <label for="proxy-host">代理地址</label>
              <input id="proxy-host" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="127.0.0.1" maxlength="253">
            </div>
            <div class="manual-proxy-row">
              <label for="proxy-port">代理端口</label>
              <input id="proxy-port" type="number" inputmode="numeric" min="1" max="65535" step="1" placeholder="7890">
            </div>
            <p class="manual-proxy-help">填写代理主机和端口，不要填入密码。此设置只用于桌面更新。</p>
            <p class="manual-proxy-error" id="proxy-setting-error" role="status" hidden></p>
            <button id="apply-proxy" type="button">应用手动代理</button>
          </div>
          <div class="setting-row">
            <span class="setting-label"><span>自动检查更新</span><span class="setting-help">定期在后台检查</span></span>
            <input id="auto-check" type="checkbox" aria-label="自动检查更新">
          </div>
        </section>

        <section class="card" aria-labelledby="probe-title">
          <div class="card-heading">
            <h2 id="probe-title">连接诊断</h2>
            <small id="probe-route">未测试</small>
          </div>
          <p class="probe-status" id="probe-status" role="status" aria-live="polite">尚未测试更新连接。</p>
          <p class="probe-meta" id="probe-meta"></p>
          <button class="probe-button" id="probe-button" type="button" data-action="test-connection">测试连接</button>
        </section>
      </aside>
    </main>

    <footer class="footer" id="footer-status" aria-live="polite">仅支持 AgentWorkShop Windows 桌面安装版。</footer>
  </div>

  <script>
    (() => {
      const api = window.awUpdateCenter
      const root = document.documentElement
      const statusCard = document.getElementById('status-card')
      const statusKicker = document.getElementById('status-kicker')
      const statusBadge = document.getElementById('status-badge')
      const pageTitle = document.getElementById('page-title')
      const statusDetail = document.getElementById('status-detail')
      const headVersion = document.getElementById('head-version')
      const releaseVersion = document.getElementById('release-version')
      const progressWrap = document.getElementById('progress-wrap')
      const progressTrack = document.getElementById('progress-track')
      const progressBar = document.getElementById('progress-bar')
      const progressValue = document.getElementById('progress-value')
      const progressDetail = document.getElementById('progress-detail')
      const notice = document.getElementById('notice')
      const notes = document.getElementById('notes')
      const checkButton = document.getElementById('check-button')
      const downloadButton = document.getElementById('download-button')
      const pauseButton = document.getElementById('pause-button')
      const cancelButton = document.getElementById('cancel-button')
      const installButton = document.getElementById('install-button')
      const retryButton = document.getElementById('retry-button')
      const proxyMode = document.getElementById('proxy-mode')
      const manualProxySettings = document.getElementById('manual-proxy-settings')
      const proxyProtocol = document.getElementById('proxy-protocol')
      const proxyHost = document.getElementById('proxy-host')
      const proxyPort = document.getElementById('proxy-port')
      const applyProxy = document.getElementById('apply-proxy')
      const proxySettingError = document.getElementById('proxy-setting-error')
      const autoCheck = document.getElementById('auto-check')
      const probeButton = document.getElementById('probe-button')
      const probeStatus = document.getElementById('probe-status')
      const probeRoute = document.getElementById('probe-route')
      const probeMeta = document.getElementById('probe-meta')
      const footerStatus = document.getElementById('footer-status')
      const actionButtons = [checkButton, downloadButton, pauseButton, cancelButton, installButton, retryButton, probeButton]
      const settingsControls = [proxyMode, proxyProtocol, proxyHost, proxyPort, applyProxy, autoCheck, probeButton]
      const labels = {
        idle: '空闲',
        checking: '检查中',
        current: '已是最新',
        available: '有新版本',
        downloading: '下载中',
        paused: '已暂停',
        verifying: '校验中',
        ready: '已就绪',
        installing: '安装中',
        error: '错误',
      }
      const copy = {
        idle: ['准备检查更新', '检查 AgentWorkShop 的最新桌面版本。'],
        checking: ['正在检查更新', '正在连接更新服务，请稍候。'],
        current: ['已是最新版本', '当前桌面版本已经是最新版本。'],
        available: ['发现新版本', '新版本已准备好下载。'],
        downloading: ['正在下载更新', '更新包正在下载，请保持应用运行。'],
        paused: ['下载已暂停', '可以继续下载，或取消本次更新。'],
        verifying: ['正在校验更新', '正在验证下载包的完整性。'],
        ready: ['更新已准备就绪', '更新包已验证，可以安装并重启 AgentWorkShop。'],
        installing: ['正在安装更新', '应用即将退出并由安装程序完成更新。'],
        error: ['更新失败', '更新操作未完成，可以检查连接后重试。'],
      }
      const emptyProbe = { status: 'idle', route: 'unknown', elapsedMs: null, error: null }
      let savedProxyKey
      let state = { status: 'idle', proxyMode: 'system', manualProxy: { protocol: 'http', host: '', port: null }, autoCheckUpdates: true, probe: emptyProbe }

      function text(value, fallback = '') {
        return typeof value === 'string' ? value : fallback
      }

      function number(value) {
        return typeof value === 'number' && Number.isFinite(value) ? value : null
      }

      function clampProgress(value) {
        const result = number(value)
        return result === null ? null : Math.max(0, Math.min(100, result))
      }

      function formatBytes(value) {
        const bytes = number(value)
        if (bytes === null || bytes < 0) return '未知大小'
        if (bytes < 1024) return `${Math.round(bytes)} B`
        const units = ['KB', 'MB', 'GB']
        let amount = bytes
        let unit = -1
        while (amount >= 1024 && unit < units.length - 1) {
          amount /= 1024
          unit += 1
        }
        return `${amount.toFixed(amount >= 10 ? 0 : 1)} ${units[unit]}`
      }

      function formatSpeed(value) {
        const speed = number(value)
        return speed === null || speed <= 0 ? '' : `${formatBytes(speed)}/s`
      }

      function formatEta(value) {
        const seconds = number(value)
        if (seconds === null || seconds < 0) return ''
        if (seconds < 60) return `${Math.ceil(seconds)} 秒`
        return `${Math.floor(seconds / 60)} 分 ${Math.ceil(seconds % 60)} 秒`
      }

      function send(action, value) {
        return api?.action(action, value) === true
      }

      function setVisible(element, visible) {
        element.hidden = !visible
      }

      function setButton(button, visible, enabled, label) {
        setVisible(button, visible)
        button.disabled = !enabled
        if (label) button.textContent = label
      }

      function setProgress(next) {
        const status = next.status
        const visible = ['downloading', 'paused', 'verifying', 'ready', 'installing'].includes(status)
        setVisible(progressWrap, visible)
        const progress = clampProgress(next.progress)
        progressBar.style.width = `${progress ?? 0}%`
        progressValue.textContent = progress === null ? '总量未知' : `${Math.round(progress)}%`
        if (progress === null) progressTrack.removeAttribute('aria-valuenow')
        else progressTrack.setAttribute('aria-valuenow', String(Math.round(progress)))
        progressTrack.setAttribute('aria-valuetext', progressValue.textContent)
        const received = formatBytes(next.received)
        const total = formatBytes(next.total)
        const speed = formatSpeed(next.speed)
        const eta = formatEta(next.eta)
        const details = []
        if (next.received !== null && next.received !== undefined) details.push(`${received} / ${total}`)
        if (speed) details.push(speed)
        if (eta) details.push(`剩余 ${eta}`)
        progressDetail.textContent = details.join(' · ')
        progressDetail.hidden = details.length === 0
        progressWrap.querySelector('#progress-label').textContent = status === 'verifying' ? '校验进度' : status === 'ready' ? '已完成' : '下载进度'
      }

      function manualProxyValue() {
        return {
          mode: 'manual',
          config: {
            protocol: proxyProtocol.value,
            host: proxyHost.value.trim(),
            port: Number(proxyPort.value),
          },
        }
      }

      function showProxyError(message) {
        proxySettingError.textContent = message
        setVisible(proxySettingError, Boolean(message))
      }

      function setManualProxy(next) {
        const proxy = next.manualProxy ?? {}
        const key = JSON.stringify([next.proxyMode, proxy.protocol, proxy.host, proxy.port])
        if (key === savedProxyKey) return
        savedProxyKey = key
        proxyMode.value = ['direct', 'manual'].includes(next.proxyMode) ? next.proxyMode : 'system'
        proxyProtocol.value = ['http', 'https', 'socks5'].includes(proxy.protocol) ? proxy.protocol : 'http'
        proxyHost.value = text(proxy.host)
        proxyPort.value = Number.isInteger(proxy.port) ? String(proxy.port) : ''
        manualProxySettings.hidden = proxyMode.value !== 'manual'
      }

      function setActions(next) {
        const status = next.status
        const busy = next.busy === true || ['checking', 'downloading', 'verifying', 'installing'].includes(status)
        const canCheck = !busy && ['idle', 'current', 'error'].includes(status)
        const retryDownload = status === 'error' && next.errorStage === 'download' && Boolean(next.version)
        const canDownload = !busy && ['available', 'paused'].includes(status)
        const canPause = status === 'downloading'
        const canCancel = ['downloading', 'verifying'].includes(status) || (!busy && (status === 'paused' || retryDownload))
        const canInstall = !busy && status === 'ready' && next.canInstall === true
        setButton(checkButton, canCheck && !retryDownload, canCheck)
        setButton(downloadButton, canDownload, canDownload, status === 'paused' ? '继续下载' : '下载更新')
        setButton(pauseButton, canPause, canPause, '暂停下载')
        setButton(cancelButton, canCancel, canCancel)
        setButton(installButton, status === 'ready', canInstall)
        retryButton.dataset.action = retryDownload ? 'download' : 'check'
        setButton(retryButton, status === 'error', canCheck, retryDownload ? '重试下载' : '重试检查')
        settingsControls.forEach(control => { control.disabled = busy })
        if (status === 'ready' && next.canInstall !== true) installButton.title = '当前环境不支持自动安装'
        else installButton.removeAttribute('title')
      }

      function setProbe(probe) {
        const next = probe && typeof probe === 'object' ? { ...emptyProbe, ...probe } : emptyProbe
        const status = text(next.status, 'idle')
        const route = text(next.route, 'unknown')
        const statusLabels = { idle: '尚未测试更新连接。', testing: '正在测试更新连接…', ok: '更新连接正常。', error: '更新连接测试失败。' }
        const routeLabels = { direct: '直连', manual: '手动代理', proxy: '系统代理规则', mixed: '系统混合规则', system: '跟随系统', unknown: '—' }
        probeStatus.textContent = text(next.error, statusLabels[status] || statusLabels.idle)
        probeStatus.dataset.kind = status
        probeRoute.textContent = routeLabels[route] || routeLabels.unknown
        const meta = []
        if (number(next.elapsedMs) !== null) meta.push(`${Math.max(0, Math.round(next.elapsedMs))} ms`)
        if (next.error && status !== 'error') meta.push(text(next.error))
        probeMeta.textContent = meta.join(' · ')
      }

      function apply(next) {
        if (!next || typeof next !== 'object') return
        state = { ...state, ...next, probe: next.probe && typeof next.probe === 'object' ? next.probe : state.probe }
        const status = labels[state.status] ? state.status : 'idle'
        const message = copy[status]
        root.dataset.status = status
        if (state.theme === 'light' || state.theme === 'dark') root.dataset.theme = state.theme
        statusCard.dataset.status = status
        statusBadge.textContent = labels[status]
        statusKicker.textContent = status === 'error' ? 'UPDATE ERROR' : status === 'installing' ? 'INSTALLING' : 'DESKTOP UPDATE'
        pageTitle.textContent = message[0]
        statusDetail.textContent = state.error ? text(state.error, message[1]) : message[1]
        const version = text(state.version)
        const current = text(state.currentVersion)
        headVersion.textContent = current ? `当前 v${current}` : ''
        releaseVersion.textContent = version ? `v${version}` : ''
        setProgress({ ...state, status })
        const note = text(state.notice)
        notice.textContent = note
        setVisible(notice, Boolean(note))
        notes.textContent = text(state.notes, '检查到新版本后，版本说明会显示在这里。')
        notes.classList.toggle('empty', !state.notes)
        setActions({ ...state, status })
        setProbe(state.probe)
        if (status === 'error' && state.errorStage) footerStatus.textContent = `失败阶段：${text(state.errorStage)}`
        else if (status === 'installing') footerStatus.textContent = '安装程序正在接管更新流程。'
        else footerStatus.textContent = '仅支持 AgentWorkShop Windows 桌面安装版。'
        setManualProxy(state)
        showProxyError(text(state.proxySettingError))
        autoCheck.checked = state.autoCheckUpdates === true
      }

      if (!api) {
        root.dataset.ready = 'missing'
        apply({ status: 'error', error: '更新中心接口不可用。' })
        return
      }
      root.dataset.ready = 'true'
      actionButtons.forEach(button => button.addEventListener('click', () => send(button.dataset.action)))
      proxyMode.addEventListener('change', () => {
        showProxyError('')
        if (proxyMode.value === 'manual') {
          manualProxySettings.hidden = false
          if (state.proxyMode !== 'manual') showProxyError('应用手动代理后，新线路才会生效。')
          proxyHost.focus()
          return
        }
        manualProxySettings.hidden = true
        send('set-proxy', proxyMode.value)
      })
      applyProxy.addEventListener('click', () => {
        showProxyError('')
        if (!send('set-proxy', manualProxyValue())) showProxyError('请输入有效的主机和端口，不要填入网址或凭据。')
      })
      autoCheck.addEventListener('change', () => send('set-auto-check', autoCheck.checked))
      api.onState(apply)
      apply(state)
      api.hello()
    })()
  </script>
</body>
</html>
