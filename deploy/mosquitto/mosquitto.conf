# ============================================================
# 生产版 mosquitto 配置(S1:鉴权 + ACL + TLS)
# ------------------------------------------------------------
# 用法(生产,替换 docker-compose.yml 中 no-auth 默认):
#   1. 生成密码文件(容器内执行):
#      docker run --rm -v ./deploy/mosquitto:/mosquitto/config eclipse-mosquitto:2 \
#        mosquitto_passwd -c /mosquitto/config/passwd awshop
#   2. docker-compose.yml 的 daq-mosquitto 改为:
#        command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
#        volumes:
#          - ./deploy/mosquitto:/mosquitto/config
#   3. 应用侧 config.yml:
#      daq.mqtt: { host, port: 8883, username: awshop, password: <同上>, secure: true, caFile: <CA 路径> }
#      (或整体用环境变量 DAQ_MQTT_URL=mqtts://user:pass@host:8883 + DAQ_MQTT_CA_FILE)
# ============================================================

per_listener_settings true

# --- TLS 监听(生产) ---
listener 8883
protocol mqtt
cafile   /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile  /mosquitto/config/server.key
# tls_version tlsv1.2

# --- 鉴权 + per-topic ACL ---
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/aclfile

# --- 持久化与日志 ---
persistence true
persistence_location /mosquitto/data/
log_dest stdout
