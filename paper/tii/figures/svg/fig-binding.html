<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @page { size: 88mm 40mm; margin: 0; }
  html,body { margin:0; padding:0; }
  svg { display:block; }
  text { font-family: Arial, Helvetica, sans-serif; fill: #1a1f24; }
  .ltitle { font-size: 2.3px; font-weight: bold; }
  .btitle { font-size: 2.1px; font-weight: bold; }
  .bsub   { font-size: 1.95px; fill: #454e56; }
  .conn   { font-size: 1.9px; font-style: italic; fill: #5F6B76; }
  rect.box { fill: #ffffff; stroke-width: 0.32; }
</style></head>
<body>
<svg width="88mm" height="40mm" viewBox="0 0 88 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="t" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#1F6F78"/></marker>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#C8871B"/></marker>
    <marker id="p" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#6A4C93"/></marker>
    <marker id="g" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#5F6B76"/></marker>
  </defs>

  <!-- Lane 1: commissioning (teal) -->
  <text x="1.2" y="3.0" class="ltitle" fill="#154f55">&#9312; Commissioning binding</text>
  <g>
    <rect class="box" x="1.2" y="4.2" width="19" height="7.4" rx="1" stroke="#1F6F78"/>
    <text x="10.7" y="7.2" text-anchor="middle" class="btitle">Plant device</text>
    <text x="10.7" y="9.8" text-anchor="middle" class="bsub">integration export</text>
    <rect class="box" x="24.2" y="4.2" width="19" height="7.4" rx="1" stroke="#1F6F78"/>
    <text x="33.7" y="7.2" text-anchor="middle" class="btitle">Connection test</text>
    <text x="33.7" y="9.8" text-anchor="middle" class="bsub">real-protocol probe</text>
    <rect class="box" x="47.2" y="4.2" width="19" height="7.4" rx="1" stroke="#1F6F78"/>
    <text x="56.7" y="7.2" text-anchor="middle" class="btitle">Platform node</text>
    <text x="56.7" y="9.8" text-anchor="middle" class="bsub">typed &#183; addressed</text>
    <rect class="box" x="70.2" y="4.2" width="16.6" height="7.4" rx="1" stroke="#1F6F78"/>
    <text x="78.5" y="7.2" text-anchor="middle" class="btitle">Semantic card</text>
    <text x="78.5" y="9.8" text-anchor="middle" class="bsub">unit &#183; ranges</text>
  </g>
  <path d="M 20.2,7.9 H 23.4" fill="none" stroke="#1F6F78" stroke-width="0.45" marker-end="url(#t)"/>
  <path d="M 43.2,7.9 H 46.4" fill="none" stroke="#1F6F78" stroke-width="0.45" marker-end="url(#t)"/>
  <path d="M 66.2,7.9 H 69.4" fill="none" stroke="#1F6F78" stroke-width="0.45" marker-end="url(#t)"/>

  <!-- connector -->
  <path d="M 44,11.6 V 15.2" fill="none" stroke="#5F6B76" stroke-width="0.4" marker-end="url(#g)"/>
  <text x="45.3" y="14.0" class="conn">the same node</text>

  <!-- Lane 2: agent binding (amber) -->
  <text x="1.2" y="17.6" class="ltitle" fill="#8a5c10">&#9313; Agent binding</text>
  <g>
    <rect class="box" x="1.2" y="18.8" width="19" height="7.4" rx="1" stroke="#C8871B"/>
    <text x="10.7" y="21.8" text-anchor="middle" class="btitle">Agent / team</text>
    <text x="10.7" y="24.4" text-anchor="middle" class="bsub">lead or member</text>
    <rect class="box" x="24.2" y="18.8" width="19" height="7.4" rx="1" stroke="#C8871B"/>
    <text x="33.7" y="21.8" text-anchor="middle" class="btitle">Binding mode</text>
    <text x="33.7" y="24.4" text-anchor="middle" class="bsub">manual / auto / unbound</text>
    <rect class="box" x="47.2" y="18.8" width="19" height="7.4" rx="1" stroke="#C8871B"/>
    <text x="56.7" y="21.8" text-anchor="middle" class="btitle">Tool surface</text>
    <text x="56.7" y="24.4" text-anchor="middle" class="bsub">governed write path</text>
    <rect class="box" x="70.2" y="18.8" width="16.6" height="7.4" rx="1" stroke="#C8871B"/>
    <text x="78.5" y="21.8" text-anchor="middle" class="btitle">Approval gate</text>
    <text x="78.5" y="24.4" text-anchor="middle" class="bsub">stage 0 on manual</text>
  </g>
  <path d="M 20.2,22.5 H 23.4" fill="none" stroke="#C8871B" stroke-width="0.45" marker-end="url(#a)"/>
  <path d="M 43.2,22.5 H 46.4" fill="none" stroke="#C8871B" stroke-width="0.45" marker-end="url(#a)"/>
  <path d="M 66.2,22.5 H 69.4" fill="none" stroke="#C8871B" stroke-width="0.45" marker-end="url(#a)"/>

  <!-- connector -->
  <path d="M 44,26.2 V 29.8" fill="none" stroke="#5F6B76" stroke-width="0.4" marker-end="url(#g)"/>
  <text x="45.3" y="28.6" class="conn">renders live</text>

  <!-- Lane 3: rendering binding (purple) -->
  <text x="1.2" y="32.2" class="ltitle" fill="#4a3568">&#9314; Rendering binding</text>
  <g>
    <rect class="box" x="1.2" y="33.4" width="19" height="6" rx="1" stroke="#6A4C93"/>
    <text x="10.7" y="35.7" text-anchor="middle" class="btitle">Device-twin entity</text>
    <text x="10.7" y="38.1" text-anchor="middle" class="bsub">modelRef &#183; agentId</text>
    <rect class="box" x="24.2" y="33.4" width="19" height="6" rx="1" stroke="#6A4C93"/>
    <text x="33.7" y="35.7" text-anchor="middle" class="btitle">Scene entity</text>
    <text x="33.7" y="38.1" text-anchor="middle" class="bsub">three.js mesh</text>
    <rect class="box" x="47.2" y="33.4" width="19" height="6" rx="1" stroke="#6A4C93"/>
    <text x="56.7" y="35.7" text-anchor="middle" class="btitle">State planes</text>
    <text x="56.7" y="38.1" text-anchor="middle" class="bsub">live &#183; desired &#183; actual</text>
    <rect class="box" x="70.2" y="33.4" width="16.6" height="6" rx="1" stroke="#6A4C93"/>
    <text x="78.5" y="35.7" text-anchor="middle" class="btitle">WS live push</text>
    <text x="78.5" y="38.1" text-anchor="middle" class="bsub">no-poll event bus</text>
  </g>
  <path d="M 20.2,36.4 H 23.4" fill="none" stroke="#6A4C93" stroke-width="0.45" marker-end="url(#p)"/>
  <path d="M 43.2,36.4 H 46.4" fill="none" stroke="#6A4C93" stroke-width="0.45" marker-end="url(#p)"/>
  <path d="M 66.2,36.4 H 69.4" fill="none" stroke="#6A4C93" stroke-width="0.45" marker-end="url(#p)"/>
</svg>
</body></html>
