<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @page { size: 181mm 62mm; margin: 0; }
  html,body { margin:0; padding:0; }
  svg { display:block; }
  text { font-family: Arial, Helvetica, sans-serif; fill: #1a1f24; }
  .ztitle { font-size: 2.9px; font-weight: bold; }
  .btitle { font-size: 2.7px; font-weight: bold; }
  .bsub   { font-size: 2.2px; fill: #454e56; }
  .flow   { font-size: 2.2px; font-weight: bold; }
  .band   { font-size: 2.6px; font-style: italic; fill: #5F6B76; }
  .note   { font-size: 2.4px; fill: #5F6B76; }
  rect.box { fill: #ffffff; stroke-width: 0.3; }
</style></head>
<body>
<svg width="181mm" height="62mm" viewBox="0 0 181 62" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ab" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#3D6FB5"/></marker>
    <marker id="at" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#1F6F78"/></marker>
    <marker id="ap" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#6A4C93"/></marker>
    <marker id="ar" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#B3282D"/></marker>
    <marker id="ag" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#5F6B76"/></marker>
    <marker id="at2" markerWidth="6" markerHeight="5" refX="1" refY="2.5" orient="auto"><path d="M6,0 L0,2.5 L6,5 z" fill="#1F6F78"/></marker>
  </defs>

  <!-- ══ Entry band ══ -->
  <text x="90.5" y="2.6" text-anchor="middle" class="note">Operator &amp; external-agent entry surfaces — all pass the same binding model</text>
  <g>
    <rect class="box" x="2" y="3.6" width="33" height="4.6" rx="1" stroke="#5F6B76"/>
    <text x="18.5" y="6.3" text-anchor="middle" class="bsub">Web console</text>
    <rect class="box" x="38" y="3.6" width="33" height="4.6" rx="1" stroke="#5F6B76"/>
    <text x="54.5" y="6.3" text-anchor="middle" class="bsub">TUI workbench</text>
    <rect class="box" x="74" y="3.6" width="33" height="4.6" rx="1" stroke="#5F6B76"/>
    <text x="90.5" y="6.3" text-anchor="middle" class="bsub">MCP server · 25 tools</text>
    <rect class="box" x="110" y="3.6" width="33" height="4.6" rx="1" stroke="#5F6B76"/>
    <text x="126.5" y="6.3" text-anchor="middle" class="bsub">A2A endpoint</text>
    <rect class="box" x="146" y="3.6" width="33" height="4.6" rx="1" stroke="#5F6B76"/>
    <text x="162.5" y="6.3" text-anchor="middle" class="bsub">Plugin host (hot-reload)</text>
  </g>

  <!-- entry collectors: Web+TUI -> agent half; MCP+A2A+Plugin -> bridge -->
  <path d="M 18.5,8.2 V 10.6 H 30 V 12.6" fill="none" stroke="#5F6B76" stroke-width="0.35" marker-end="url(#ag)"/>
  <path d="M 54.5,8.2 V 10.6 H 33.5" fill="none" stroke="#5F6B76" stroke-width="0.35"/>
  <path d="M 90.5,8.2 V 10.6 H 74 V 12.6" fill="none" stroke="#5F6B76" stroke-width="0.35" marker-end="url(#ag)"/>
  <path d="M 126.5,8.2 V 10.6 H 96" fill="none" stroke="#5F6B76" stroke-width="0.35"/>
  <path d="M 162.5,8.2 V 10.6 H 96" fill="none" stroke="#5F6B76" stroke-width="0.35"/>

  <!-- ══ Zone containers ══ -->
  <rect x="2" y="13" width="43" height="34.5" rx="1.5" fill="#EDF3FA" stroke="#3D6FB5" stroke-width="0.35"/>
  <text x="23.5" y="15.4" text-anchor="middle" class="ztitle" fill="#2a4d80">Agent half</text>
  <rect x="53" y="13" width="42" height="34.5" rx="1.5" fill="#FBF1DE" stroke="#C8871B" stroke-width="0.45"/>
  <text x="74" y="15.4" text-anchor="middle" class="ztitle" fill="#8a5c10">Governed bridge</text>
  <rect x="103" y="13" width="53" height="34.5" rx="1.5" fill="#E8F1F2" stroke="#1F6F78" stroke-width="0.35"/>
  <text x="129.5" y="15.4" text-anchor="middle" class="ztitle" fill="#154f55">Industrial half</text>

  <!-- Agent half boxes -->
  <g>
    <rect class="box" x="3.5" y="17" width="41" height="7.6" rx="1" stroke="#3D6FB5"/>
    <text x="23.5" y="19.9" text-anchor="middle" class="btitle">Harness registry — 14 engines</text>
    <text x="23.5" y="22.6" text-anchor="middle" class="bsub">availability allow-list probe</text>
    <rect class="box" x="3.5" y="26.6" width="41" height="7.6" rx="1" stroke="#3D6FB5"/>
    <text x="23.5" y="29.5" text-anchor="middle" class="btitle">Teams &amp; channels</text>
    <text x="23.5" y="32.2" text-anchor="middle" class="bsub">lead supervision · task tree · watchdog</text>
    <rect class="box" x="3.5" y="36.2" width="41" height="7.6" rx="1" stroke="#3D6FB5"/>
    <text x="23.5" y="39.1" text-anchor="middle" class="btitle">Memory stack</text>
    <text x="23.5" y="41.8" text-anchor="middle" class="bsub">FTS5+vector · RRF/MMR · compaction</text>
  </g>

  <!-- Governed bridge boxes -->
  <g>
    <rect class="box" x="55" y="17" width="38" height="6" rx="1" stroke="#C8871B"/>
    <text x="74" y="19.4" text-anchor="middle" class="btitle">Agent tool surface — 48 tools</text>
    <text x="74" y="21.8" text-anchor="middle" class="bsub">semantic cards ground physical units</text>
    <rect class="box" x="55" y="24.5" width="38" height="6" rx="1" stroke="#C8871B"/>
    <text x="74" y="26.9" text-anchor="middle" class="btitle">Node bindings</text>
    <text x="74" y="29.3" text-anchor="middle" class="bsub">manual / auto / unbound gate the path</text>
    <rect class="box" x="55" y="32" width="38" height="9.5" rx="1" stroke="#C8871B" stroke-width="0.45"/>
    <text x="74" y="34.4" text-anchor="middle" class="btitle">Governed write path (Alg. 1)</text>
    <text x="74" y="36.9" text-anchor="middle" class="bsub">approval → guardrail → interlock →</text>
    <text x="74" y="39.4" text-anchor="middle" class="bsub">readback-verified write → journal</text>
    <rect class="box" x="55" y="43" width="38" height="3.9" rx="1" stroke="#C8871B"/>
    <text x="74" y="44.8" text-anchor="middle" class="bsub"><tspan font-weight="bold">Backstop</tspan> (30 s cadence, breach ≥ 3):</text>
    <text x="74" y="46.5" text-anchor="middle" class="bsub">bounded rollback K=2 → human</text>
  </g>

  <!-- Industrial half boxes -->
  <g>
    <rect class="box" x="105" y="16" width="49" height="5.2" rx="1" stroke="#1F6F78"/>
    <text x="129.5" y="18.1" text-anchor="middle" class="btitle">Protocol drivers</text>
    <text x="129.5" y="20.2" text-anchor="middle" class="bsub">Modbus TCP/RTU · OPC UA · MQTT · HTTP</text>
    <rect class="box" x="105" y="22.5" width="49" height="5.2" rx="1" stroke="#1F6F78"/>
    <text x="129.5" y="24.6" text-anchor="middle" class="btitle">Edge runtimes — 3 decoupled intervals</text>
    <text x="129.5" y="26.7" text-anchor="middle" class="bsub">per-node schedule · in-flight exclusion</text>
    <rect class="box" x="105" y="29" width="49" height="5.2" rx="1" stroke="#1F6F78"/>
    <text x="129.5" y="31.1" text-anchor="middle" class="btitle">Gateway sweep</text>
    <text x="129.5" y="33.2" text-anchor="middle" class="bsub">rotating cursor · starvation-free quota 64</text>
    <rect class="box" x="105" y="35.5" width="49" height="5.2" rx="1" stroke="#1F6F78"/>
    <text x="129.5" y="37.6" text-anchor="middle" class="btitle">Alarm chain</text>
    <text x="129.5" y="39.7" text-anchor="middle" class="bsub">hysteresis · debounce · recipe-window overlay</text>
    <rect class="box" x="105" y="42" width="49" height="5.2" rx="1" stroke="#1F6F78"/>
    <text x="129.5" y="44.1" text-anchor="middle" class="btitle">Line / recipe management</text>
    <text x="129.5" y="46.2" text-anchor="middle" class="bsub">versioning · known-good · active runs</text>
  </g>

  <!-- Plant scenarios -->
  <g>
    <rect class="box" x="161" y="20" width="18" height="6.5" rx="1" stroke="#1F6F78" stroke-dasharray="1.2 0.7"/>
    <text x="170" y="22.6" text-anchor="middle" class="bsub" font-weight="bold">film-line</text>
    <text x="170" y="25.1" text-anchor="middle" class="bsub">scenario</text>
    <rect class="box" x="161" y="31" width="19.5" height="6.5" rx="1" stroke="#1F6F78" stroke-dasharray="1.2 0.7"/>
    <text x="170" y="33.6" text-anchor="middle" class="bsub" font-weight="bold">cast-film physics</text>
    <text x="170" y="36.1" text-anchor="middle" class="bsub">twin + ODE</text>
  </g>

  <!-- ══ Flows (orthogonal, routed in clear channels only) ══ -->
  <!-- proposals: agent half -> bridge -->
  <path d="M 45,20 H 53" fill="none" stroke="#3D6FB5" stroke-width="0.55" marker-end="url(#ab)"/>
  <text x="49" y="18.8" text-anchor="middle" class="flow" fill="#3D6FB5">proposals</text>
  <!-- verified write / readback: bridge write path <-> industrial drivers -->
  <path d="M 93,36 H 99 V 18.6 H 103" fill="none" stroke="#1F6F78" stroke-width="0.6" marker-end="url(#at)" marker-start="url(#at2)"/>
  <text x="101.1" y="30.5" class="flow" fill="#1F6F78" transform="rotate(-90 101.1 30.5)" text-anchor="middle">verified write ⇄ readback</text>
  <!-- journal / state: bridge -> storage -->
  <path d="M 74,47.5 V 51.6" fill="none" stroke="#5F6B76" stroke-width="0.45" marker-end="url(#ag)"/>
  <text x="75.3" y="50.2" class="flow" fill="#5F6B76" font-weight="normal">journal · state</text>
  <!-- WS push: industrial -> twin registry -->
  <path d="M 120,47.5 V 51.6" fill="none" stroke="#6A4C93" stroke-width="0.55" marker-end="url(#ap)"/>
  <text x="118.7" y="50.2" text-anchor="end" class="flow" fill="#6A4C93" font-weight="normal">WS push</text>
  <!-- scene-edit writeback: 3D scene -> industrial half (governed) -->
  <path d="M 152,51.6 V 47.9" fill="none" stroke="#B3282D" stroke-width="0.5" stroke-dasharray="1.4 0.8" marker-end="url(#ar)"/>
  <text x="153.3" y="50.2" class="flow" fill="#B3282D" font-weight="normal">scene-edit writeback</text>
  <!-- plant links: industrial <-> plants -->
  <path d="M 154,22.5 H 161" fill="none" stroke="#1F6F78" stroke-width="0.4" marker-end="url(#at)"/>
  <path d="M 161,25 H 154" fill="none" stroke="#5F6B76" stroke-width="0.35"/>
  <path d="M 154,33.5 H 161" fill="none" stroke="#1F6F78" stroke-width="0.4" marker-end="url(#at)"/>
  <path d="M 161,36 H 154" fill="none" stroke="#5F6B76" stroke-width="0.35"/>

  <!-- ══ Bottom band ══ -->
  <g>
    <rect class="box" x="2" y="52" width="40" height="7.2" rx="1" stroke="#5F6B76"/>
    <text x="22" y="54.7" text-anchor="middle" class="btitle">Audit plane</text>
    <text x="22" y="57.2" text-anchor="middle" class="bsub">signed journal · ops log · attribution</text>
    <rect class="box" x="44.5" y="52" width="43.5" height="7.2" rx="1" stroke="#5F6B76"/>
    <text x="65.5" y="54.7" text-anchor="middle" class="btitle">Storage — one data domain</text>
    <text x="65.5" y="57.2" text-anchor="middle" class="bsub">TimescaleDB · MinIO · SQLite (WAL)</text>
    <rect class="box" x="89" y="52" width="56" height="7.2" rx="1" stroke="#6A4C93"/>
    <text x="117" y="54.7" text-anchor="middle" class="btitle">Device-twin registry</text>
    <text x="117" y="57.2" text-anchor="middle" class="bsub">modelRef · boundAgentId · 3 state planes</text>
    <rect class="box" x="147.5" y="52" width="31.5" height="7.2" rx="1" stroke="#6A4C93"/>
    <text x="163.25" y="54.7" text-anchor="middle" class="btitle">3D scene (three.js)</text>
    <text x="163.25" y="57.2" text-anchor="middle" class="bsub">live render · twin observes</text>
  </g>
  <text x="90.5" y="61.3" text-anchor="middle" class="band">Data, audit &amp; digital-twin plane — one data domain</text>
</svg>
</body></html>
