<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @page { size: 88mm 38mm; margin: 0; }
  html,body { margin:0; padding:0; }
  svg { display:block; }
  text { font-family: Arial, Helvetica, sans-serif; fill: #1a1f24; }
  .btitle { font-size: 2.15px; font-weight: bold; }
  .bsub   { font-size: 1.85px; fill: #454e56; }
  .lbl    { font-size: 1.75px; font-style: italic; fill: #5F6B76; }
  .ptitle { font-size: 2.2px; font-weight: bold; fill: #154f55; }
  rect.box { fill: #ffffff; stroke-width: 0.32; }
</style></head>
<body>
<svg width="88mm" height="38mm" viewBox="0 0 88 38" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="t" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#1F6F78"/></marker>
    <marker id="g" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#5F6B76"/></marker>
    <marker id="r" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#B3282D"/></marker>
    <marker id="a2" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 z" fill="#C8871B"/></marker>
  </defs>

  <!-- ══ Object tree ══ -->
  <g>
    <rect class="box" x="1.5" y="1.5" width="13" height="8" rx="1" stroke="#1F6F78"/>
    <text x="8" y="4.7" text-anchor="middle" class="btitle">Line</text>
    <text x="8" y="7.3" text-anchor="middle" class="bsub">production</text>
    <rect class="box" x="25" y="1.5" width="15" height="8" rx="1" stroke="#1F6F78"/>
    <text x="32.5" y="4.7" text-anchor="middle" class="btitle">Product</text>
    <text x="32.5" y="7.3" text-anchor="middle" class="bsub">film type</text>
    <rect class="box" x="49" y="1.5" width="16" height="8" rx="1" stroke="#C8871B"/>
    <text x="57" y="4.7" text-anchor="middle" class="btitle" fill="#8a5c10">Recipe</text>
    <text x="57" y="7.3" text-anchor="middle" class="bsub">v1 &#183; v2 &#183; v3</text>
    <rect x="74.5" y="1.5" width="12.3" height="8" rx="1" fill="#E8F1F2" stroke="#1F6F78" stroke-width="0.4"/>
    <text x="80.65" y="4.7" text-anchor="middle" class="btitle">Run</text>
    <text x="80.65" y="7.3" text-anchor="middle" class="bsub">C(n,r) window</text>
  </g>
  <path d="M 14.5,5.5 H 24.2" fill="none" stroke="#5F6B76" stroke-width="0.4" marker-end="url(#g)"/>
  <text x="19.3" y="4.3" text-anchor="middle" class="lbl">1 : N</text>
  <path d="M 40,5.5 H 48.2" fill="none" stroke="#5F6B76" stroke-width="0.4" marker-end="url(#g)"/>
  <text x="44.1" y="4.3" text-anchor="middle" class="lbl">1 : N</text>
  <path d="M 65,5.5 H 73.7" fill="none" stroke="#1F6F78" stroke-width="0.45" marker-end="url(#t)"/>
  <text x="69.3" y="4.3" text-anchor="middle" class="lbl">binds</text>

  <!-- ══ Breach exits (from Run) ══ -->
  <path d="M 80.65,9.5 V 13.9 H 47.5" fill="none" stroke="#B3282D" stroke-width="0.4" stroke-dasharray="1.3 0.7"/>
  <path d="M 47.5,13.9 V 16.2" fill="none" stroke="#B3282D" stroke-width="0.4" stroke-dasharray="1.3 0.7" marker-end="url(#r)"/>
  <path d="M 76.5,13.9 V 16.2" fill="none" stroke="#B3282D" stroke-width="0.4" stroke-dasharray="1.3 0.7" marker-end="url(#r)"/>
  <text x="64" y="12.7" text-anchor="middle" class="lbl" fill="#B3282D">out-of-window breach</text>
  <g>
    <rect class="box" x="33" y="16.5" width="29" height="5.8" rx="1" stroke="#B3282D"/>
    <text x="47.5" y="18.8" text-anchor="middle" class="bsub"><tspan font-weight="bold" fill="#B3282D">automatic rollback</tspan> &#183; K = 2</text>
    <text x="47.5" y="21.0" text-anchor="middle" class="bsub">chain-limited, non-destructive</text>
    <rect class="box" x="66" y="16.5" width="20.8" height="5.8" rx="1" stroke="#B3282D"/>
    <text x="76.4" y="18.8" text-anchor="middle" class="bsub"><tspan font-weight="bold" fill="#B3282D">human escalation</tspan></text>
    <text x="76.4" y="21.0" text-anchor="middle" class="bsub">mandatory after K</text>
  </g>

  <!-- ══ Recipe lifecycle pipeline ══ -->
  <text x="1.5" y="26.4" class="ptitle">Recipe lifecycle (versioned, non-destructive)</text>
  <g>
    <rect class="box" x="1.5" y="28" width="15" height="7" rx="1" stroke="#C8871B"/>
    <text x="9" y="30.9" text-anchor="middle" class="btitle">Edit</text>
    <text x="9" y="33.4" text-anchor="middle" class="bsub">authoring checks</text>
    <rect class="box" x="22.5" y="28" width="15" height="7" rx="1" stroke="#C8871B"/>
    <text x="30" y="30.9" text-anchor="middle" class="btitle">Version n+1</text>
    <text x="30" y="33.4" text-anchor="middle" class="bsub">history intact</text>
    <rect class="box" x="43.5" y="28" width="15" height="7" rx="1" stroke="#C8871B"/>
    <text x="51" y="30.9" text-anchor="middle" class="btitle">Known-good</text>
    <text x="51" y="33.4" text-anchor="middle" class="bsub">frozen baseline</text>
    <rect class="box" x="64.5" y="28" width="15" height="7" rx="1" stroke="#C8871B"/>
    <text x="72" y="30.9" text-anchor="middle" class="btitle">Revert</text>
    <text x="72" y="33.4" text-anchor="middle" class="bsub">restores origin</text>
    <rect x="82.5" y="28" width="4.3" height="7" rx="1" fill="#E8F1F2" stroke="#1F6F78" stroke-width="0.4"/>
    <text x="84.65" y="31.9" text-anchor="middle" class="btitle" fill="#154f55">Run</text>
  </g>
  <path d="M 16.7,31.5 H 21.9" fill="none" stroke="#C8871B" stroke-width="0.45" marker-end="url(#a2)"/>
  <text x="19.3" y="30.2" text-anchor="middle" class="lbl" font-size="1.55">creates</text>
  <path d="M 37.7,31.5 H 42.9" fill="none" stroke="#C8871B" stroke-width="0.45" marker-end="url(#a2)"/>
  <text x="40.3" y="30.2" text-anchor="middle" class="lbl" font-size="1.55">marks</text>
  <path d="M 58.7,31.5 H 63.9" fill="none" stroke="#C8871B" stroke-width="0.45" marker-end="url(#a2)"/>
  <text x="61.3" y="30.2" text-anchor="middle" class="lbl" font-size="1.55">reverts</text>
  <path d="M 79.7,31.5 H 81.9" fill="none" stroke="#1F6F78" stroke-width="0.45" marker-end="url(#t)"/>
  <text x="44" y="37.3" text-anchor="middle" class="bsub" font-style="italic">known-good rollback re-dispatches the frozen set &#183; one-click apply opens a fresh batch</text>
</svg>
</body></html>
