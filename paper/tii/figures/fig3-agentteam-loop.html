  <title>AgentTeam hub-and-spoke architecture with the governed AgentLoop</title>

  <defs>
    <marker id="ahG" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">

    </marker>
  </defs>

  <line x1="480" y1="440" x2="434" y2="140" stroke="#6A4C93" stroke-width="2.4" opacity="0.9"/>

  <circle cx="480" cy="610" r="4.5" fill="#3D6FB5"/>

  <!-- 1 observe: PLC nodes -> AgentTeam -->
  <path d="M1066,830 L1022,623" fill="none" stroke="#5F6B76" stroke-width="2.2" marker-end="url(#ahG)"/>

  <path d="M1020,500 L1112,436" fill="none" stroke="#5F6B76" stroke-width="2.2" marker-end="url(#ahG)"/>

  <path d="M1160,396 L1160,247" fill="none" stroke="#5F6B76" stroke-width="2.2" marker-end="url(#ahG)"/>

  <path d="M1408,244 L1408,789" fill="none" stroke="#5F6B76" stroke-width="2.2" marker-end="url(#ahG)"/>

  <path d="M1066,950 L847,707" fill="none" stroke="#5F6B76" stroke-width="2.2" marker-end="url(#ahG)"/>

  <path d="M1160,796 L1160,473" fill="none" stroke="#B3282D" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ahR)"/>

  <path d="M960,748 L960,692" fill="none" stroke="#5F6B76" stroke-width="2.2" marker-end="url(#ahG)"/>

    <text x="40" y="95"><tspan font-weight="700">hot-reload host</tspan> · fault isolation</text>

    <text x="40" y="147">per-plugin settings</text>
    <text x="40" y="173"><tspan font-weight="700">ctx.services</tspan> — shared capability bus</text>
    <text x="40" y="199" fill="#5F6B76">no direct plant I/O</text>
  </g>

  <g fill="#C8871B">

    <text x="1082" y="147"><tspan font-weight="700">dcw_judge</tspan> — judges but cannot actuate</text>
    <text x="1082" y="173"><tspan font-weight="700">recipe_update</tspan> · <tspan font-weight="700">rollback</tspan></text>
    <text x="1082" y="199">cards: unit · range · window · freshness</text>
  </g>

  <text x="418" y="825" font-size="18" fill="#5F6B76" text-anchor="end">versioned set-points</text>

  <g fill="#3D6FB5">

    <text x="1082" y="893">per-node edge runtime</text>
    <text x="1082" y="919">intervals: acq 5 s · WS 1 s · trend 5 s</text>
    <text x="1082" y="945">gateway sweep: rotating cursor · quota 64</text>
    <text x="1082" y="971">alarms: band 8% · hyst 2% · debounce 3</text>
  </g>

  <!-- ================= CENTER HUB: AGENTTEAM (amber) ============================ -->
  <rect x="480" y="356" width="540" height="340" rx="12" fill="#F8ECD6" stroke="#C8871B" stroke-width="2.5"/>
  <text x="496" y="391" font-size="27" font-weight="700" fill="#8F5E0E">AgentTeam</text>
  <text x="1004" y="387" font-size="18" fill="#5F6B76" text-anchor="end">governed bridge to the plant</text>

  <text x="508" y="540" font-size="19" font-weight="700" fill="#8F5E0E">Cross-channel bus</text>
  <text x="508" y="566" font-size="18" fill="#2E353B">lead-gated</text>

  <text x="724" y="584" font-size="18" fill="#2E353B">300 s stall watchdog</text>

  <text x="508" y="676" font-size="18" fill="#2E353B">MMR λ = 0.7 · 3-layer injection · compact 70%</text>
