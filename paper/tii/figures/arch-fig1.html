<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentWorkShop architecture — Fig. 1</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  #wrap{width:1600px;height:740px;background:#ffffff;}
  svg{display:block;}
  text{font-family:"Liberation Sans","Helvetica Neue",Arial,sans-serif;}
  .mono{font-family:"Liberation Mono","DejaVu Sans Mono",Consolas,monospace;}
</style>
</head>
<body>
<div id="wrap">
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"
     font-family="Liberation Sans, Helvetica Neue, Arial, sans-serif">

  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#1F5C3A"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#2B4C7E"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#8C6508"/>
    </marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#2C3E50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="740" fill="#ffffff"/>

  <!-- ======================== INTEROPERABILITY PLANE ======================== -->
  <rect data-container="1" x="56" y="40" width="1488" height="44" rx="5" fill="#EEF2F6" stroke="#5B6B7C" stroke-width="1.2"/>
  <rect x="56" y="40" width="6" height="44" rx="3" fill="#5B6B7C"/>
  <text x="80" y="67" font-size="14" fill="#243444">
    <tspan font-weight="700">Interoperability plane</tspan>
    <tspan fill="#4A5A6A">&#160;&#160;|&#160;&#160;WebSocket AEP v1 (resumable sequence)&#160;&#160;&#183;&#160;&#160;MCP server (25 tools)&#160;&#160;&#183;&#160;&#160;A2A agent card + JSON-RPC&#160;&#160;&#183;&#160;&#160;208 REST route files</tspan>
  </text>

  <!-- ============================ GROUP FRAMES ============================ -->
  <rect data-container="1" x="56" y="124" width="368" height="194" rx="7" fill="#F4F7FC" stroke="#2B4C7E" stroke-width="1.3" stroke-dasharray="7 4"/>
  <rect x="56" y="124" width="368" height="22" rx="7" fill="#2B4C7E"/>
  <rect x="56" y="139" width="368" height="7" fill="#2B4C7E"/>
  <text x="240" y="140" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.7">AGENT HALF</text>

  <rect data-container="1" x="472" y="124" width="300" height="194" rx="7" fill="#FDF6EC" stroke="#B8860B" stroke-width="1.3" stroke-dasharray="7 4"/>
  <rect x="472" y="124" width="300" height="22" rx="7" fill="#B8860B"/>
  <rect x="472" y="139" width="300" height="7" fill="#B8860B"/>
  <text x="622" y="140" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.7">GOVERNED BRIDGE</text>

  <rect data-container="1" x="823" y="124" width="366" height="194" rx="7" fill="#F1F8F6" stroke="#1F5C3A" stroke-width="1.3" stroke-dasharray="7 4"/>
  <rect x="823" y="124" width="366" height="22" rx="7" fill="#1F5C3A"/>
  <rect x="823" y="139" width="366" height="7" fill="#1F5C3A"/>
  <text x="1006" y="140" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.7">INDUSTRIAL HALF</text>

  <!-- ========================== AGENT-HALF CARDS ========================== -->
  <rect x="90" y="158" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.2"/>
  <rect x="90" y="158" width="5" height="34" rx="2.5" fill="#2B4C7E"/>
  <text x="108" y="174" font-size="12.8" font-weight="700" fill="#16283F">Harness registry</text>
  <text x="108" y="187" font-size="10.6" fill="#4A5A6A">14 engines &#183; uniform capability matrix</text>

  <rect x="90" y="202" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.2"/>
  <rect x="90" y="202" width="5" height="34" rx="2.5" fill="#2B4C7E"/>
  <text x="108" y="218" font-size="12.8" font-weight="700" fill="#16283F">Lead scheduler + task engine</text>
  <text x="108" y="231" font-size="10.6" fill="#4A5A6A">7-state task tree &#183; rule-guaranteed fallback</text>

  <rect x="90" y="246" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.2"/>
  <rect x="90" y="246" width="5" height="34" rx="2.5" fill="#2B4C7E"/>
  <text x="108" y="262" font-size="12.8" font-weight="700" fill="#16283F">Typed memory</text>
  <text x="108" y="275" font-size="10.6" fill="#4A5A6A">FTS5-CJK + vector &#183; RRF + MMR &#183; 3-layer injection</text>

  <rect x="90" y="290" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.2"/>
  <rect x="90" y="290" width="5" height="34" rx="2.5" fill="#2B4C7E"/>
  <text x="108" y="306" font-size="12.8" font-weight="700" fill="#16283F">Teams / channels / TUI / SDK</text>
  <text x="108" y="319" font-size="10.6" fill="#4A5A6A">operator and developer surfaces</text>

  <!-- ============================ BRIDGE CARDS ============================ -->
  <rect x="472" y="158" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.2"/>
  <rect x="472" y="158" width="5" height="34" rx="2.5" fill="#B8860B"/>
  <text x="490" y="174" font-size="12.8" font-weight="700" fill="#5A3F06">Semantic cards</text>
  <text x="490" y="187" font-size="10.6" fill="#6B5A34">unit &#183; hard range &#183; recipe window &#183; freshness</text>

  <rect x="472" y="202" width="300" height="34" rx="4" fill="#FFFCF4" stroke="#8C6508" stroke-width="2.1"/>
  <rect x="472" y="202" width="5" height="34" rx="2.5" fill="#8C6508"/>
  <text x="490" y="218" font-size="12.8" font-weight="700" fill="#3E2C04">Governed tool surface</text>
  <text x="490" y="231" font-size="10.6" fill="#5F4D22"><tspan class="mono" font-size="10.4">dcw_control</tspan> &#8212; the sole write path into the plant</text>

  <rect x="472" y="246" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.2"/>
  <rect x="472" y="246" width="5" height="34" rx="2.5" fill="#B8860B"/>
  <text x="490" y="262" font-size="12.8" font-weight="700" fill="#5A3F06">HITL approval gate</text>
  <text x="490" y="275" font-size="10.6" fill="#6B5A34">binding modes: manual / auto / unbound</text>

  <rect x="472" y="290" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.2"/>
  <rect x="472" y="290" width="5" height="34" rx="2.5" fill="#B8860B"/>
  <text x="490" y="306" font-size="12.8" font-weight="700" fill="#5A3F06">Rollback backstop</text>
  <text x="490" y="319" font-size="10.6" fill="#6B5A34">breach counting &#183; bounded auto-recovery (K&#160;=&#160;2)</text>

  <!-- ========================= INDUSTRIAL-HALF CARDS ========================= -->
  <rect x="857" y="158" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#1F5C3A" stroke-width="1.2"/>
  <rect x="857" y="158" width="5" height="34" rx="2.5" fill="#1F5C3A"/>
  <text x="875" y="174" font-size="12.8" font-weight="700" fill="#123524">Protocol drivers</text>
  <text x="875" y="187" font-size="10.6" fill="#3E5A4C">Modbus TCP/RTU &#183; OPC UA &#183; MQTT &#183; HTTP &#183; mock</text>

  <rect x="857" y="202" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#1F5C3A" stroke-width="1.2"/>
  <rect x="857" y="202" width="5" height="34" rx="2.5" fill="#1F5C3A"/>
  <text x="875" y="218" font-size="12.8" font-weight="700" fill="#123524">Per-node edge runtimes</text>
  <text x="875" y="231" font-size="10.6" fill="#3E5A4C">3 decoupled intervals &#183; sweep quota 64 per 250 ms</text>

  <rect x="857" y="246" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#1F5C3A" stroke-width="1.2"/>
  <rect x="857" y="246" width="5" height="34" rx="2.5" fill="#1F5C3A"/>
  <text x="875" y="262" font-size="12.8" font-weight="700" fill="#123524">Alarm chain</text>
  <text x="875" y="275" font-size="10.6" fill="#3E5A4C">warn band &#183; 2&#160;% hysteresis &#183; 3-tick debounce</text>

  <rect x="857" y="290" width="300" height="34" rx="4" fill="#FFFFFF" stroke="#1F5C3A" stroke-width="1.2"/>
  <rect x="857" y="290" width="5" height="34" rx="2.5" fill="#1F5C3A"/>
  <text x="875" y="306" font-size="12.8" font-weight="700" fill="#123524">Time-series + object store</text>
  <text x="875" y="319" font-size="10.6" fill="#3E5A4C">TimescaleDB &#183; MinIO &#183; degraded local fallback</text>

  <!-- ==================== INTERNAL ARROWS WITHIN GROUPS ==================== -->
  <path d="M92,307 L72,307 L72,219 L86,219" fill="none" stroke="#2B4C7E" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M240,192 L240,200" fill="none" stroke="#2B4C7E" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M240,236 L240,244" fill="none" stroke="#2B4C7E" stroke-width="1.5" marker-end="url(#aB)"/>

  <path d="M622,192 L622,200" fill="none" stroke="#B8860B" stroke-width="1.5" marker-end="url(#aA)"/>
  <path d="M622,236 L622,244" fill="none" stroke="#B8860B" stroke-width="1.5" marker-end="url(#aA)"/>
  <path d="M622,280 L622,288" fill="none" stroke="#B8860B" stroke-width="1.5" marker-end="url(#aA)"/>

  <path d="M1007,192 L1007,200" fill="none" stroke="#1F5C3A" stroke-width="1.5" marker-end="url(#aG)"/>
  <path d="M1007,236 L1007,244" fill="none" stroke="#1F5C3A" stroke-width="1.5" marker-end="url(#aG)"/>
  <path d="M1007,280 L1007,288" fill="none" stroke="#1F5C3A" stroke-width="1.5" marker-end="url(#aG)"/>

  <!-- ======================== CROSS-GROUP CONNECTORS ======================== -->
  <!-- G -> B : harness registry feeds the semantic cards -->
  <path d="M392,175 L470,175" fill="none" stroke="#2B4C7E" stroke-width="1.7" marker-end="url(#aB)"/>
  <text x="431" y="169" font-size="9.4" fill="#3A5578" text-anchor="middle">bind</text>

  <!-- G -> B : the lead submits every proposal through the governed surface -->
  <path d="M392,219 L470,219" fill="none" stroke="#2B4C7E" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="431" y="213" font-size="9.4" fill="#3A5578" text-anchor="middle">propose</text>

  <!-- GOVERNED WRITE RAIL (amber): leaves the rollback backstop, drops into the
       inter-group channel at x = 888, enters the edge tier from below, and
       continues down to the plant. No run crosses a card or a frame edge. -->
  <path d="M774,307 L888,307 L888,240 L1007,240 L1007,254" fill="none" stroke="#8C6508" stroke-width="2.3" marker-end="url(#aA)"/>
  <path d="M888,307 L888,592 L1162,592" fill="none" stroke="#8C6508" stroke-width="2.3" marker-end="url(#aA)"/>
  <text transform="translate(880,452) rotate(-90)" font-size="11" font-weight="700" fill="#8C6508" text-anchor="middle" letter-spacing="0.5">governed write</text>

  <!-- PLC / PLANT -->
  <rect x="1164" y="566" width="280" height="52" rx="5" fill="#E7EEF5" stroke="#2C3E50" stroke-width="1.7"/>
  <rect x="1164" y="566" width="6" height="52" rx="3" fill="#2C3E50"/>
  <text x="1306" y="588" font-size="13.5" font-weight="700" fill="#1B2A38" text-anchor="middle">PLC / physical plant</text>
  <text x="1306" y="605" font-size="10.8" fill="#4A5A6A" text-anchor="middle">hard real-time control + safety functions</text>

  <!-- PROCESS I/O: a closed loop between the plant and the protocol drivers.
       Both runs descend into the free space below the card row and return along
       the right-hand margin, so neither crosses a card. -->
  <path d="M1462,578 L1478,578 L1478,240 L1159,240" fill="none" stroke="#2C3E50" stroke-width="1.9" marker-end="url(#aS)"/>
  <path d="M1462,604 L1532,604 L1532,388 L1516,388 L1516,196 L1159,196" fill="none" stroke="#2C3E50" stroke-width="1.9" marker-end="url(#aS)"/>
  <text transform="translate(1548,430) rotate(-90)" font-size="11" font-weight="700" fill="#2C3E50" text-anchor="middle" letter-spacing="0.5">process I/O</text>

  <!-- ============================== AUDIT PLANE ============================== -->
  <rect data-container="1" x="56" y="664" width="1488" height="50" rx="5" fill="#F2F4F3" stroke="#2C3E50" stroke-width="1.3"/>
  <rect x="56" y="664" width="6" height="50" rx="3" fill="#2C3E50"/>
  <text x="80" y="687" font-size="13.6" fill="#1B2A38">
    <tspan font-weight="700">Shared audit plane</tspan>
    <tspan fill="#4A5A6A">&#160;&#160;|&#160;&#160;</tspan>
    <tspan class="mono" font-size="12.2" fill="#3A4A5A">audit_log</tspan>
    <tspan fill="#4A5A6A"> (actor &#183; actor kind user/agent/system &#183; target &#183; 8 event kinds)&#160;&#160;&#183;&#160;&#160;recipe log + version history&#160;&#160;&#183;&#160;&#160;signed write-journal anchors (previous/new value, source, approval, record)</tspan>
  </text>
  <text x="80" y="705" font-size="11.4" fill="#6B7A88">Every write, alarm, recipe change and rollback is attributed here; agent actions carry their channel and member badge.</text>

  <!-- dashed attribution feeds from each region into the audit plane -->
  <path d="M254,320 L254,660" fill="none" stroke="#7C8B99" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#aS)"/>
  <path d="M622,326 L622,660" fill="none" stroke="#7C8B99" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#aS)"/>
  <path d="M1007,326 L1007,660" fill="none" stroke="#7C8B99" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#aS)"/>

</svg>
</div>
</body>
